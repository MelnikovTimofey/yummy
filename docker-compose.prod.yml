# Прод-контур Арома Ателье для одного облачного VPS.
#
# Отличия от локального docker-compose.yml:
#   - Postgres в том же контуре (сервис db), наружу не публикуется, данные — в
#     volume atelier_pg; бэкапы — ночной pg_dump на хосте (см. prod-deploy-runbook.md);
#   - секреты приходят из .env без локальных дефолтов (compose падает, если не заданы);
#   - образы собирает CI (.github/workflows/atelier-images.yml) и кладёт в GHCR с
#     тегом = SHA коммита; на хосте они только скачиваются (scripts/atelier/deploy.sh).
#     Выкаченные теги — ATELIER_TAG_<СЕРВИС> в .env. Секция build оставлена для
#     аварийной сборки на хосте (`up -d --build`);
#   - фронты собираются с реальным публичным API-доменом (в CI — из env workflow,
#     при аварийной сборке — PUBLIC_API_URL, build-arg);
#   - наружу торчит только Caddy (80/443) с авто-TLS; backend и фронты — внутри сети;
#   - бот — часть контура (не profile), один automation-токен с backend.
#
# Выкатка: scripts/atelier/deploy.sh [сервис ...] (см. docs/atelier/prod-operations.md §4)
# Перед первым стартом заполнить .env по образцу .env.prod.example.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: atelier
    volumes:
      - atelier_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/melnikovtimofey/atelier-backend:${ATELIER_TAG_BACKEND:-main}
    build:
      context: ./apps/backend
    environment:
      HOST: 0.0.0.0
      PORT: "3021"
      APP_NAME: atelier-backend
      # Местное время точки (Волгоград, UTC+3): границы дня дашборда, недели
      # расхода и месяц трат считаются в поясе процесса. Дневной код от него не
      # зависит — он считает московское время явно (daily-code.ts).
      TZ: Europe/Volgograd
      # Пароль подставляется в URL как есть — только URL-безопасные символы
      # (openssl rand -hex 32).
      DATABASE_URL: postgresql://atelier:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/atelier?schema=public
      ATELIER_AUTOMATION_KEY: ${ATELIER_AUTOMATION_KEY:?ATELIER_AUTOMATION_KEY is required}
      ATELIER_TOKEN_SECRET: ${ATELIER_TOKEN_SECRET:?ATELIER_TOKEN_SECRET is required}
      ATELIER_TOKEN_TTL_HOURS: ${ATELIER_TOKEN_TTL_HOURS:-24}
      # Бот входа гостей в кабинет (#239); пусто — кнопка входа не показывается.
      ATELIER_GUEST_LOGIN_BOT_USERNAME: ${ATELIER_GUEST_LOGIN_BOT_USERNAME:-}
      ATELIER_GUEST_TOKEN_TTL_DAYS: ${ATELIER_GUEST_TOKEN_TTL_DAYS:-90}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  aroma-web:
    image: ghcr.io/melnikovtimofey/atelier-aroma-web:${ATELIER_TAG_AROMA_WEB:-main}
    build:
      context: ./apps/aroma-web
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    environment:
      # vite preview блокирует чужой Host — разрешаем прод-домен (за ним Caddy).
      ATELIER_ALLOWED_HOSTS: ${AROMA_DOMAIN:?AROMA_DOMAIN is required}
    restart: unless-stopped
    # Без healthcheck `up --wait` (deploy.sh) считал фронт готовым сразу после
    # старта контейнера, и Caddy пару секунд отдавал 502, пока поднимался vite (#162).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4174/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      backend:
        condition: service_healthy

  master-web:
    image: ghcr.io/melnikovtimofey/atelier-master-web:${ATELIER_TAG_MASTER_WEB:-main}
    build:
      context: ./apps/master-web
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
        # Кнопка «Витрина гостя» на экране рейлов.
        VITE_AROMA_WEB_URL: https://${AROMA_DOMAIN:?AROMA_DOMAIN is required}
    environment:
      ATELIER_ALLOWED_HOSTS: ${MASTER_DOMAIN:?MASTER_DOMAIN is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4175/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      backend:
        condition: service_healthy

  telegram-bot:
    image: ghcr.io/melnikovtimofey/atelier-telegram-bot:${ATELIER_TAG_TELEGRAM_BOT:-main}
    build:
      context: ./services/telegram-bot
    environment:
      ATELIER_BACKEND_URL: http://backend:3021
      # Один токен на обе стороны: рассинхрон → backend отдаёт 401 боту (red flag).
      ATELIER_BACKEND_AUTOMATION_TOKEN: ${ATELIER_AUTOMATION_KEY:?ATELIER_AUTOMATION_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      ATELIER_BOT_STATE_PATH: /data/atelier-telegram-bot-state.json
    volumes:
      - atelier_bot_state:/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  telegram-tunnel:
    image: ghcr.io/melnikovtimofey/atelier-telegram-tunnel:${ATELIER_TAG_TELEGRAM_TUNNEL:-main}
    # Для хостов без IPv6 (в РФ IPv4 до api.telegram.org заблокирован): SSH-туннель
    # через хост вне РФ. Сервис отвечает в сети контура под именем api.telegram.org,
    # поэтому бот ходит «напрямую» и видит настоящий сертификат Telegram — TLS
    # идёт насквозь, промежуточный хост токен не видит. Цель форварда резолвится
    # на удалённой стороне. Включается COMPOSE_PROFILES=tg-tunnel в .env.
    profiles: ["tg-tunnel"]
    build:
      context: ./services/telegram-tunnel
    command:
      - ssh
      - -N
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/keys/known_hosts
      - -i
      - /keys/id_ed25519
      - -p
      - ${TG_TUNNEL_PORT:-22}
      - -L
      - 0.0.0.0:443:api.telegram.org:443
      - ${TG_TUNNEL_TARGET:-}
    volumes:
      - ./secrets/telegram-tunnel:/keys:ro
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api.telegram.org

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      AROMA_DOMAIN: ${AROMA_DOMAIN:?AROMA_DOMAIN is required}
      MASTER_DOMAIN: ${MASTER_DOMAIN:?MASTER_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - backend
      - aroma-web
      - master-web

volumes:
  atelier_pg:
  atelier_bot_state:
  caddy_data:
  caddy_config:

# IPv6 на сети контура: в РФ IPv4 до api.telegram.org заблокирован, доступен
# только IPv6. Контейнер telegram-bot ходит в Telegram по IPv6 через NAT66
# (маскарад ULA-подсети в глобальный IPv6 хоста). Требует включённого IPv6 в
# демоне Docker (ipv6 + ip6tables, см. docs/atelier/prod-deploy-runbook.md).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d0c:e6::/64
