version: 2

# Свежую версию пакета берём не раньше чем через неделю: угнанные релизы обычно
# снимают за первые дни. Обновления безопасности приходят без задержки.
updates:
  - package-ecosystem: npm
    directories:
      - /apps/backend
      - /apps/aroma-web
      - /apps/master-web
      - /services/telegram-bot
      - /tests/smoke
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Одно обновление — один PR на все каталоги (#641): по одному на каталог они
    # конфликтовали по lockfile и копились.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
        group-by: dependency-name
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
