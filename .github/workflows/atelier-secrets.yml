name: Atelier Secrets

# Репозиторий публичный: секрет, попавший в коммит, утёк сразу. Проверяются только
# новые коммиты PR или push; история на момент включения чистая (gitleaks v8.30.1).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: atelier-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atelier-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --log-opts="${range}"
