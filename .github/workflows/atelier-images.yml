name: Atelier Images

# Прод-образы собираются здесь, а не на прод-хосте: сборка на 2 vCPU / 4 GB
# отнимала ресурсы у живого контура. Каждый push в main публикует все образы в
# GHCR с тегом = SHA коммита (+ main); scripts/atelier/deploy.sh на хосте только
# тянет готовые образы. Неизменившиеся сервисы собираются из кэша за секунды.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: atelier-images-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/melnikovtimofey
  # Публичные адреса прода зашиваются в бандлы фронтов при сборке.
  PUBLIC_API_URL: https://api.yummy-aroma-atelier.ru
  AROMA_URL: https://yummy-aroma-atelier.ru

jobs:
  atelier-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: apps/backend
          - service: aroma-web
            context: apps/aroma-web
          - service: master-web
            context: apps/master-web
          - service: telegram-bot
            context: services/telegram-bot
          - service: telegram-tunnel
            context: services/telegram-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/atelier-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/atelier-${{ matrix.service }}:main
          build-args: |
            VITE_API_BASE_URL=${{ env.PUBLIC_API_URL }}
            VITE_AROMA_WEB_URL=${{ env.AROMA_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
