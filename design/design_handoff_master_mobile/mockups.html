<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мобильный Мастер</title>
<link rel="stylesheet" href="../../.claude/skills/aroma-atelier-design/styles.css" />
<style>
body{margin:0;background:var(--bg-base);font-family:var(--font-sans);font-size:var(--fs-md);color:var(--text-primary)}

/* ── Доска ── */
.board{padding:28px 32px 80px;display:grid;gap:36px;background:#0c0c0e}
.board-head{display:grid;gap:8px;max-width:980px}
.board-caps{margin:0;font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.board-title{margin:0;font-family:var(--font-serif);font-weight:500;font-size:30px}
.board-text{margin:0;color:var(--text-secondary);line-height:1.55;max-width:96ch}
.board-section{display:grid;gap:14px}
.board-h2{margin:0;font-family:var(--font-serif);font-weight:500;font-size:20px}
.board-row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.frame{display:grid;gap:8px;align-content:start}
.frame-name{margin:0;font-family:var(--font-meta);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.frame-name b{color:var(--text-primary);font-weight:500}
.frame-note{margin:0;font-size:var(--fs-sm);color:var(--text-faint);max-width:375px;line-height:1.45}
.frame.wide .frame-note{max-width:812px}
.phone{width:375px;height:780px;overflow:hidden;position:relative;border:1px solid var(--border-default);border-radius:28px;background:var(--bg-base);box-shadow:var(--shadow-lg)}
.land{width:812px;height:375px;overflow:hidden;position:relative;border:1px solid var(--border-default);border-radius:24px;background:var(--bg-base);box-shadow:var(--shadow-lg)}
.shot{min-height:100vh;display:grid;place-items:start center;background:var(--bg-base)}
.shot .phone,.shot .land{border:0;border-radius:0;box-shadow:none}

/* ── Каркас телефона ── */
.m-top{position:absolute;top:0;left:0;right:0;height:54px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--border-subtle);background:var(--glass);z-index:5}
.m-top img{height:20px}
.m-top h1{margin:0;font-family:var(--font-serif);font-weight:500;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-top.sub{padding-left:6px}
.m-body{position:absolute;top:54px;left:0;right:0;bottom:56px;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.m-body.bar{bottom:68px}
.m-body.full{bottom:0}
.m-body>*{flex-shrink:0}
.m-nav{position:absolute;left:0;right:0;bottom:0;height:56px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border-subtle);background:var(--glass);z-index:5}
.m-nav span{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted)}
.m-nav span.on{color:var(--text-primary);box-shadow:inset 0 2px 0 var(--accent)}
.m-icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-secondary);flex:0 0 auto}
.m-icon.boxed{border:1px solid var(--border-default)}
.m-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--border-default);border-radius:var(--r-md);background:transparent;color:var(--text-primary);font:inherit;font-size:14px;white-space:nowrap;flex:0 0 auto}
.m-btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.m-btn.soft{border-color:var(--accent-border);background:var(--accent-soft)}
.m-btn.ghost{border-color:transparent;color:var(--text-secondary)}
.m-btn.block{width:100%}
.m-btn.sm{height:32px;padding:0 10px;font-size:13px}
.m-row{display:flex;align-items:center;gap:8px}
.m-row .grow{flex:1;min-width:0}
.m-row .m-search{flex:1 1 auto}
.m-search{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--bg-raised);color:var(--text-muted);font-size:16px;min-width:0;box-sizing:border-box}
.m-search.on{color:var(--text-primary);border-color:var(--accent-border)}
.m-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.m-chips>*{flex:0 0 auto}
.m-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border-default);border-radius:var(--r-md);overflow:hidden}
.m-seg button{height:38px;border:0;background:transparent;color:var(--text-muted);font:inherit;font-size:14px}
.m-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text-primary)}
.m-seg button+button{border-left:1px solid var(--border-default)}
.m-meta{font-family:var(--font-meta);font-size:var(--fs-xs);letter-spacing:.06em;color:var(--text-muted);font-variant-numeric:tabular-nums}
.m-h2{margin:6px 2px 0;font-family:var(--font-serif);font-weight:500;font-size:17px}
.m-faint{color:var(--text-faint)}
.m-muted{color:var(--text-muted)}
.m-warn{color:var(--warning)}
.m-danger{color:var(--danger)}

/* ── Карточки списков ── */
.m-card{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-raised)}
.m-card.dim{opacity:.62}
.m-card.sel{border-color:var(--accent-border);background:var(--accent-soft)}
.m-card-head{display:flex;align-items:flex-start;gap:10px}
.m-card-head .grow{flex:1;min-width:0;display:grid;gap:2px}
.m-title{font-weight:500;font-size:16px;line-height:1.3}
.m-title small{margin-left:8px;font-family:var(--font-meta);font-size:var(--fs-xs);letter-spacing:.04em;color:var(--text-faint);font-weight:400;font-variant-numeric:tabular-nums}
.m-sub{font-size:13px;color:var(--text-muted);line-height:1.4}
.m-caps{font-family:var(--font-meta);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.m-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-muted);flex-wrap:wrap}
.m-card-foot .stats{display:inline-flex;gap:12px;font-variant-numeric:tabular-nums}
.m-status{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px}
.m-status i{width:7px;height:7px;border-radius:999px;background:var(--success);flex:0 0 auto}
.m-status.out{color:var(--danger)}
.m-status.out i{background:var(--danger)}
.m-status.none i{background:transparent;border:1px solid var(--text-muted);box-sizing:border-box}
.m-status.none{color:var(--text-muted)}
.m-check{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--border-strong);border-radius:6px;color:var(--accent-fg);box-sizing:border-box;flex:0 0 auto;margin-top:1px}
.m-check.on{background:var(--accent);border-color:var(--accent)}
.m-bulk{position:absolute;left:10px;right:10px;bottom:66px;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border:1px solid var(--accent-border);border-radius:var(--r-lg);background:var(--bg-elevated);box-shadow:var(--shadow-lg);font-size:14px}
.m-bulk b{font-weight:500;flex:1}

/* ── Конструктор микса ── */
.mb-name{margin:0;padding:0;border:0;background:transparent;font-family:var(--font-serif);font-weight:500;font-size:26px;line-height:1.15;color:var(--text-primary)}
.mb-name.empty{color:var(--text-faint)}
.mb-desc{padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-raised);font-size:16px;line-height:1.4;color:var(--text-secondary);min-height:44px;box-sizing:border-box}
.mb-desc.empty{color:var(--text-faint)}
.mb-vis{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--r-md);font-size:15px}
.mb-section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.mb-section h2{margin:0;font-family:var(--font-meta);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.mb-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}
.mb-bar i{display:block;height:100%}
.mb-comp{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-raised)}
.mb-comp .who{display:grid;gap:2px;min-width:0}
.mb-comp .who b{font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.mb-comp .who b i{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.mb-comp .note{grid-column:1 / -1;font-size:13px}
.mb-step{display:inline-flex;align-items:center;border:1px solid var(--border-default);border-radius:var(--r-md);overflow:hidden}
.mb-step button{width:40px;height:40px;border:0;background:transparent;color:var(--text-primary);font-size:18px}
.mb-step span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle);line-height:40px}
.mb-add{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--text-secondary);font-size:15px}
.mb-empty{display:grid;gap:6px;justify-items:center;padding:22px 16px;border:1px dashed var(--border-default);border-radius:var(--r-lg);text-align:center;font-size:14px;color:var(--text-muted)}
.mb-empty b{font-family:var(--font-serif);font-weight:500;font-size:18px;color:var(--text-primary)}
.m-actionbar{position:absolute;left:0;right:0;bottom:0;height:68px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--border-subtle);background:var(--glass);z-index:5}
.m-actionbar .sum{flex:1;display:grid;gap:1px;font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.m-actionbar .sum b{font-size:16px;font-weight:500;color:var(--text-primary)}
.m-actionbar .sum.warn b{color:var(--warning)}
.m-actionbar .m-btn{height:44px;padding:0 18px;font-size:15px}

/* ── Лист снизу ── */
.m-scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5)}
.m-sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;border-top:1px solid var(--border-default);border-radius:20px 20px 0 0;background:var(--bg-raised);box-shadow:var(--shadow-lg)}
.m-sheet .handle{width:40px;height:4px;border-radius:999px;background:var(--border-strong);margin:8px auto 4px}
.m-sheet-head{display:flex;align-items:center;gap:8px;padding:4px 10px 8px 16px}
.m-sheet-head h2{margin:0;flex:1;font-family:var(--font-serif);font-weight:500;font-size:20px}
.m-sheet-body{overflow-y:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:8px}
.m-sheet-body>*{flex-shrink:0}
.lib-row{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 12px;border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-base)}
.lib-row .grow{flex:1;min-width:0;display:grid;gap:2px}
.lib-row b{font-weight:500;font-size:15px}
.lib-row.added{border-color:var(--accent-border)}
.m-select{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:1px solid var(--border-default);border-radius:var(--r-md);font-size:16px;color:var(--text-secondary)}
.m-toggle-line{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-secondary)}

/* ── Код смены ── */
.code{display:grid;gap:10px;padding:16px;border:1px solid var(--accent-border);border-radius:var(--r-lg);background:var(--accent-soft)}
.code-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.code-num{font-family:var(--font-meta);font-size:44px;letter-spacing:.18em;font-variant-numeric:tabular-nums;line-height:1}
.code-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-muted)}
.code-progress{height:4px;border-radius:999px;background:var(--border-subtle);overflow:hidden}
.code-progress i{display:block;height:100%;width:28%;background:var(--accent)}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more-grid span{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-base);font-size:15px}

/* ── Поставка ── */
.dl-sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
.dl-sum div{display:grid;gap:2px;padding:10px 12px}
.dl-sum div+div{border-left:1px solid var(--border-subtle)}
.dl-sum b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.m-card.warn{border-color:color-mix(in srgb,var(--warning) 45%,transparent)}

/* ── Альбомная ── */
.land .m-top{height:46px}
.land .m-body{top:46px;bottom:48px;padding:10px 20px 14px}
.land .m-body.bar{bottom:58px}
.land .m-nav{height:48px}
.land .m-actionbar{height:58px;padding:0 20px}
.land-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.land-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.land-split>div{display:flex;flex-direction:column;gap:10px}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.js"></script>
<script src="../../.claude/skills/aroma-atelier-design/_ds_bundle.js"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="board.jsx"></script>
</body>
</html>
