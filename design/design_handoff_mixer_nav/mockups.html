<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Намиксуй с панелью, мокап</title>
<!-- Шрифты (Google Fonts) и токены дизайн-системы, затем канон приложения и живой mixer.css:
     экран «Намиксуй» свёрстан на тех же классах, что в apps/aroma-web. -->
<link rel="stylesheet" href="../../.claude/skills/aroma-atelier-design/styles.css" />
<link rel="stylesheet" href="../../apps/aroma-web/src/design-tokens.generated.css" />
<link rel="stylesheet" href="../../apps/aroma-web/src/components/mixer/mixer.css" />
<style>
/* ── Оболочка гостя: копия правил apps/aroma-web/src/styles.css (main после #359) ── */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--gutter:20px;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%}
html{background:var(--guest-room-bg)}
body{font-family:var(--font-body);color:var(--text-0);overflow-x:hidden;background:linear-gradient(180deg,#0F0F12 0%,#161619 40%,#141417 100%)}
button,input,select,textarea{font:inherit}
button:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px}
.app-bg{min-height:100dvh;width:100%;display:grid;place-items:center;padding:0;position:relative;overflow:clip;background:var(--guest-halo-strong),linear-gradient(180deg,rgba(15,15,18,.94) 0%,rgba(20,20,23,1) 100%)}
.phone-shell{width:100%;height:100dvh;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(28,28,33,.98) 0%,rgba(20,20,23,.98) 100%);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2}
.bottom-nav{flex:0 0 auto;display:grid;padding:0 4px max(12px,var(--safe-bottom));border-top:1px solid var(--line);background:var(--guest-topbar-bg);backdrop-filter:blur(18px);position:relative;z-index:20}
.bottom-nav-item{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.bottom-nav-item[aria-current="page"]{color:var(--text-0)}
.bottom-nav-item[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:0 0 2px 2px;background:var(--accent)}
/* Подпись секции по канону (#348): sentence case вместо caps — как .aroma-label гостевого кита. */
.aroma-label{margin:0;font-family:var(--font-body);font-size:13px;font-weight:600;line-height:1.3;color:var(--text-1)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ── Срез G3 (#361) по мокапу #348: в mixer.css этого ещё нет. После #361 блок не нужен ── */
.mixer::before,.mixer-ring-halo,.mixer-card::before,.mixer-card::after{display:none}
.mixer-progress-step{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.mixer-bowl-hint{font-size:13px}
.mixer-filters-count{font-size:12px;color:var(--text-2)}
.mixer-card .mixer-card-brand{margin-top:auto;padding-top:4px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--text-muted)}
.mixer-card-match span,.mixer-card-caption{font-size:12px;color:var(--text-2)}
.mixer-stamp{transform:none!important;text-transform:none;letter-spacing:0;font-weight:600}
.mixer-deck-empty{border-style:solid}
.mixer-verdict{text-transform:none;letter-spacing:0;font-size:13px}
.mixer-split-legend{display:grid;gap:4px;font-size:12.5px}
.mixer-similar-line{margin:0;padding:12px 14px;border-radius:var(--r-guest-row);border:1px solid var(--line);background:var(--guest-row-bg);font-size:13px;color:var(--text-1)}
/* Реплика мастера (#128) по канону: плоский аватар без градиента, без caps-подписи. */
.mixer-master-line{grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 12px}
.mixer-master-avatar{width:28px;height:28px;font-size:13px;color:var(--text-1);background:var(--guest-control-bg);border-color:var(--line)}

/* Карточка «Покажите мастеру» по мокапу #348 (aroma-confirm гостевого кита). */
.aroma-confirm{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;gap:22px;padding:calc(20px + var(--safe-top)) 28px calc(28px + var(--safe-bottom));overflow-y:auto}
.aroma-confirm-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aroma-confirm-note{margin:0;font-size:14px;color:var(--text-1)}
.aroma-confirm-done{background:transparent;border:1px solid var(--line);border-radius:var(--r-guest-control);min-height:40px;padding:0 16px;color:var(--text-0);font-family:var(--font-body);font-size:13px;cursor:pointer}
.aroma-confirm-stack{display:grid;gap:10px;justify-items:center;text-align:center}
.aroma-confirm-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:var(--fs-guest-title);line-height:1.05;color:var(--text-0);text-wrap:balance}
.aroma-confirm-composition{border-radius:var(--r-guest-card);padding:16px 18px;border:1px solid var(--line);background:var(--guest-card-bg);display:grid;gap:12px;margin:0;list-style:none}
.aroma-confirm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px}
.aroma-confirm-row-text{display:grid;gap:2px;min-width:0}
.aroma-confirm-row-name{font-size:15px;color:var(--text-0)}
.aroma-confirm-row-meta{font-size:12.5px;color:var(--text-2)}
.aroma-confirm-row-share{font-size:15px;color:var(--text-0);font-variant-numeric:tabular-nums}

/* ── Предложение для mixer.css (#350) ──
   Три ссылки шага штриха встают в одну строку на 375 px при любой высоте. */
.mixer-links { gap: 0 12px; }
/* Низкий экран с панелью: отступы хода плотнее. В реализации без [data-compact]:
   атрибут нужен доске, чтобы сравнить «до» и «после». */
@media (max-height: 740px) {
  [data-compact] .mixer-swipe { gap: 6px; padding-top: 6px; padding-bottom: 6px; }
}

/* ── Только мокап: подсветка «Назад» и доска ── */
.mixer-icon-btn[data-mock-hl]{border-color:var(--accent-hover);box-shadow:0 0 0 3px var(--accent-soft)}
.board{min-height:100vh;padding:40px 48px 64px;display:grid;gap:40px;align-content:start;background:var(--guest-room-bg)}
.board h1{margin:0;font-family:var(--font-display);font-weight:500;font-size:30px;color:var(--text-0)}
.board h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:22px;color:var(--text-0)}
.board-lead{margin:8px 0 0;max-width:820px;font-size:14px;line-height:1.55;color:var(--text-1)}
.board-section{display:grid;gap:16px}
.board-section>.board-lead{margin:0}
.board-row{display:flex;flex-wrap:nowrap;gap:20px;align-items:flex-start;overflow-x:auto}
.frame,.flow-arrow{flex:none}
.frame{display:grid;gap:10px;width:375px}
.frame-name{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;color:var(--text-2)}
.frame-name b{color:var(--text-0);font-weight:600}
.frame iframe{display:block;box-sizing:content-box;width:375px;border:1px solid var(--line);border-radius:18px;background:#141417}
.frame-note{margin:0;font-size:13px;line-height:1.5;color:var(--text-1)}
.frame-note b{color:var(--text-0);font-weight:600}
.flow-arrow{align-self:center;display:grid;justify-items:center;gap:4px;width:56px;color:var(--text-1);font-size:12px;text-align:center}
.flow-arrow span:first-child{font-size:26px;color:var(--accent-hover)}
.fit{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600}
.fit[data-ok="true"]{color:#A9C9A5;border:1px solid rgba(110,154,106,.5)}
.fit[data-ok="false"]{color:#E59A92;border:1px solid rgba(207,79,68,.55)}
.shot{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--guest-room-bg)}
.shot iframe{display:block;box-sizing:content-box;width:375px;border:1px solid var(--line);border-radius:18px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.js"></script>
<script>
// Палитра: реальные табаки полки прода (снапшот 2026-10-21), бренды, flavorProfiles,
// flavors и холодок как в каталоге. Число миксов мастеров по полке 19.10.2026.
const PROFILE = {
  citrus: '#e8b948', berry: '#a23048', floral_herbal: '#7a9560', fresh: '#7fb5a3', sweet: '#d98c5a',
  spicy: '#c0492c', dessert: '#b07747', tobacco: '#7a5236', minty: '#6ba88a', fruity: '#dd8a4a',
  perfume: '#c787a8', sour: '#bcb04a',
};
const LABEL = {
  spicy: 'Пряный', dessert: 'Десертный', tobacco: 'Табачный', minty: 'Мятный', fruity: 'Фруктовый',
  floral_herbal: 'Цветочно-травяной', citrus: 'Цитрусовый', berry: 'Ягодный', perfume: 'Парфюмный',
  sweet: 'Сладкий', sour: 'Кислый', fresh: 'Свежий',
};
// Бренд в написании мокапа #348: «Darkside», а не капсом из каталога.
const T = {
  peach: { brand: 'Darkside', name: 'Virgin Peach 2.0', profiles: ['fruity'], flavors: ['персик'], mixes: 1 },
  mango: { brand: 'Darkside', name: 'Mango Lassi 2.0', profiles: ['fruity'], flavors: ['манго'] },
  star: { brand: 'Darkside', name: 'Falling Star', profiles: ['fruity'], flavors: ['манго', 'маракуйя'] },
  bitter: { brand: 'Darkside', name: 'Bittersweet', profiles: ['citrus', 'fruity', 'sour'], flavors: ['лимон', 'тоник'] },
  orange: { brand: 'Black Burn', name: 'Red Orange', profiles: ['citrus', 'fruity', 'sour'], flavors: ['апельсин'] },
  basil: { brand: 'Darkside', name: 'Basil Blast', profiles: ['floral_herbal'], flavors: ['базилик'] },
  mint: { brand: 'Black Burn', name: 'Cane Mint', profiles: ['fresh', 'minty'], flavors: ['мята'], cooling: true },
  redtea: { brand: 'Darkside', name: 'Red Tea', profiles: ['floral_herbal', 'spicy'], flavors: ['чай'] },
  mintslide: { brand: 'Darkside', name: 'Mintslide', profiles: ['dessert', 'fresh', 'minty', 'sweet'], flavors: ['жвачка', 'мята'], cooling: true },
};
const color = (t) => PROFILE[t.profiles[0]] ?? '#7a5236';
const SHARES = { 1: [100], 2: [65, 35], 3: [55, 35, 10] };
const ROLES = ['Основа', 'Акцент', 'Штрих'];
const TURNS = [
  { label: 'Основа', range: '40–70%' },
  { label: 'Акцент', range: '20–40%' },
  { label: 'Штрих', range: '5–15%' },
];
const NAV = [
  ['recommendations', 'Подбор', 'sparkles'],
  ['reels', 'Рилсы', 'clapperboard'],
  ['showcase', 'Витрина', 'gallery-horizontal-end'],
  ['catalog', 'Каталог', 'search'],
  ['mixer', 'Миксер', 'blend'],
  ['cabinet', 'Кабинет', 'circle-user-round'],
];
// Реплики мастера пока пусты (#128), блок не рендерится. Для проверки высоты берём
// двухстрочные реплики-заглушки: столько места займёт текст владельца.
const LINE_BASE = 'Персик хорош в основе. Дальше нужен акцент, который его подсветит.';
const LINE_TWIST = 'Холодка хватит немного, иначе он перебьёт лимон и персик.';

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const plural = (n, [one, few, many]) => (n % 10 === 1 && n % 100 !== 11 ? one : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many);
const profileLine = (t) => t.profiles.slice(0, 2).map((p, i) => (i ? LABEL[p].toLowerCase() : LABEL[p])).join(', ');

function chip(label, { active = false, dot } = {}) {
  const style = [
    'display:inline-flex', 'align-items:center', 'gap:7px',
    `border:1px solid ${active ? 'var(--guest-chip-border-on)' : 'var(--line)'}`,
    `background:${active ? 'var(--guest-chip-bg-on)' : 'var(--guest-chip-bg)'}`,
    `color:${active ? 'var(--guest-chip-ink-on)' : 'var(--text-1)'}`,
    'border-radius:var(--r-guest-chip)', 'padding:7px 12px', 'font-size:12px',
    `font-weight:${active ? 600 : 400}`, 'line-height:1.1', 'cursor:pointer',
    `box-shadow:${active ? 'var(--highlight-inner)' : 'none'}`,
  ].join(';');
  const dotEl = dot ? `<span aria-hidden style="width:6px;height:6px;border-radius:var(--r-pill);background:${dot};flex:0 0 auto"></span>` : '';
  return `<button type="button" aria-pressed="${active}" style="${style}">${dotEl}<span>${esc(label)}</span></button>`;
}

// Кольцо чаши: дуги в цвете ведущего профиля табака, гало под кольцом нет.
function ring(tobaccos, center) {
  const R = 78, C = 2 * Math.PI * R, half = 94;
  const shares = SHARES[tobaccos.length] ?? [];
  const gap = tobaccos.length > 1 ? 4 : 0;
  let offset = 0;
  const segs = tobaccos.map((t, i) => {
    const full = (C * shares[i]) / 100;
    const seg = `<circle class="mixer-ring-seg" cx="${half}" cy="${half}" r="${R}" fill="none" stroke="${color(t)}" stroke-width="22" stroke-dasharray="${Math.max(0, full - gap)} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${half} ${half})"/>`;
    offset += full;
    return seg;
  }).join('');
  return `<div class="mixer-ring">
    <svg viewBox="0 0 188 188" aria-hidden><circle cx="${half}" cy="${half}" r="${R}" fill="none" stroke="var(--line)" stroke-width="22"/>${segs}</svg>
    <div class="mixer-ring-center">${center}</div>
  </div>`;
}

const draftName = (tobaccos) => {
  const [base, ...rest] = tobaccos;
  const named = [base, ...rest.filter((t) => !t.cooling)];
  const notes = [...new Set(named.map((t) => t.flavors[0]))];
  const joined = notes.length === 1 ? notes[0] : `${notes.slice(0, -1).join(', ')} и ${notes.at(-1)}`;
  return joined[0].toUpperCase() + joined.slice(1) + (rest.some((t) => t.cooling) ? ' со льдом' : '');
};

function card(t, pos, match) {
  const top = pos === 0;
  const foot = match.value
    ? `<div class="mixer-card-match"><b>${esc(match.value)}</b><span>${esc(match.caption)}</span></div>`
    : `<span class="mixer-card-caption">${esc(match.caption)}</span>`;
  return `<div class="mixer-card" data-pos="${pos}" style="--pc:${color(t)}" ${top ? `role="group" aria-roledescription="карта табака" aria-label="${esc(t.brand)} ${esc(t.name)}"` : 'aria-hidden="true"'}>
    ${top ? '<span class="mixer-stamp mixer-stamp-take" aria-hidden>Беру</span><span class="mixer-stamp mixer-stamp-skip" aria-hidden>Дальше</span>' : ''}
    <span class="mixer-card-profile"><span class="mixer-dot" style="background:${color(t)}" aria-hidden></span>${esc(profileLine(t))}</span>
    <span class="mixer-card-brand">${esc(t.brand)}</span>
    <span class="mixer-card-name">${esc(t.name)}</span>
    <span class="mixer-card-flavors">${esc(t.flavors.join(', '))}</span>
    <div class="mixer-card-foot">${foot}${t.cooling ? '<span class="mixer-card-tag">холодок</span>' : ''}</div>
  </div>`;
}

function topbar(hl) {
  return `<header class="mixer-topbar">
    <button type="button" class="mixer-icon-btn" aria-label="Назад" ${hl ? 'data-mock-hl' : ''}>←</button>
    <h1 id="mixer-title" class="mixer-title">Намиксуй</h1>
    <span aria-hidden></span>
  </header>`;
}

function masterLine(text) {
  if (!text) return '';
  return `<div class="mixer-master-line">
    <span class="mixer-master-avatar" aria-hidden>М</span>
    <div class="mixer-master-body"><span class="sr-only">Мастер:</span><span aria-live="polite"><span class="mixer-master-text" style="animation:none">${esc(text)}</span></span></div>
  </div>`;
}

// Ход сборки: turn 0–2, chosen — табаки в чаше, deck — три верхние карты колоды.
function swipe({ turn, chosen, deck, matches, shelves, count, fromOnboarding, line }) {
  const progress = `<div class="mixer-progress">
    <div class="mixer-progress-row">
      <span class="mixer-progress-step">Ход ${turn + 1} из 3</span>
      <span class="mixer-progress-role">${TURNS[turn].label}, <span>${TURNS[turn].range}</span></span>
    </div>
    <div class="mixer-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${turn}"><span style="width:${(turn / 3) * 100}%"></span></div>
  </div>`;
  const harmony = chosen.length === 1 ? 70 : 81;
  const center = chosen.length ? `<span class="mixer-ring-score">${harmony}</span>` : '';
  const info = chosen.length
    ? `<p class="mixer-bowl-name">${esc(draftName(chosen))}</p>
       <ul class="mixer-bowl-comps">${chosen.map((t) => `<li><span class="mixer-dot" style="background:${color(t)}" aria-hidden></span>${esc(t.name)}</li>`).join('')}</ul>`
    : '<p class="mixer-bowl-hint">Гармония появится после основы</p>';
  const chips = [chip('Все', { active: !shelves.selected.length })]
    .concat(shelves.order.map((p) => chip(LABEL[p], { active: shelves.selected.includes(p), dot: PROFILE[p] })))
    .join('');
  const countText = `${count} ${plural(count, ['табак', 'табака', 'табаков'])}${fromOnboarding ? ' из вашего подбора' : ''}`;
  return `${progress}
  <div class="mixer-swipe">
    ${masterLine(line)}
    <div class="mixer-bowl-row">${ring(chosen, center)}<div class="mixer-bowl-info">${info}</div></div>
    <div class="mixer-filters">
      <div class="mixer-filters-head">
        <h2 class="aroma-label">Полки</h2>
        <span class="mixer-filters-count" aria-live="polite">${countText}</span>
      </div>
      <div class="mixer-shelves" role="group" aria-label="Полки, можно несколько">${chips}</div>
    </div>
    <div class="mixer-deck-slot"><div class="mixer-deck">${deck.map((t, i) => card(t, i, matches[i])).reverse().join('')}</div></div>
    <div class="mixer-actions">
      <button type="button" class="mixer-round" aria-label="Дальше">×</button>
      <button type="button" class="mixer-round mixer-round-take" aria-label="Беру">✓</button>
    </div>
    <div class="mixer-links">
      <button type="button" class="mixer-link" disabled>Вернуть прошлую</button>
      ${turn === 2 ? '<button type="button" class="mixer-link">Без штриха</button>' : ''}
      <button type="button" class="mixer-link">Доверюсь мастеру</button>
    </div>
  </div>`;
}

const mixes = (n) => (n > 0 ? { value: String(n), caption: `${plural(n, ['микс', 'микса', 'миксов'])} мастеров с ним` } : { caption: 'В миксах мастеров не встречается' });
const pct = (v) => ({ value: `${v}%`, caption: 'совпадение с чашей' });
const ALL_SHELVES = ['fruity', 'berry', 'dessert', 'citrus', 'floral_herbal', 'minty', 'spicy', 'tobacco', 'perfume'];

const TURN_STATE = {
  base: {
    turn: 0, chosen: [], deck: [T.peach, T.mango, T.star], matches: [mixes(1), mixes(1), mixes(0)],
    shelves: { order: ALL_SHELVES, selected: ['fruity'] }, count: 178, fromOnboarding: true,
  },
  accent: {
    turn: 1, chosen: [T.peach], deck: [T.bitter, T.orange, T.basil], matches: [pct(84), pct(81), pct(66)],
    shelves: { order: ALL_SHELVES.filter((p) => p !== 'perfume'), selected: [] }, count: 268,
  },
  twist: {
    turn: 2, chosen: [T.peach, T.bitter], deck: [T.mint, T.redtea, T.mintslide], matches: [pct(79), pct(72), pct(70)],
    shelves: { order: ['minty', 'spicy', 'fresh', 'floral_herbal', 'dessert'], selected: [] }, count: 14,
  },
};

function reveal() {
  const bowl = [T.peach, T.bitter, T.mint];
  const shares = SHARES[3];
  const radius = 'var(--r-guest-control)';
  const segs = bowl.map((t, i) => `<div class="mixer-split-seg" style="flex-basis:${shares[i]}%;background:var(--composition-${i + 1});border-radius:${i === 0 ? radius : 0} ${i === 2 ? `${radius} ${radius}` : '0 0'} ${i === 0 ? radius : 0}">${shares[i] >= 10 ? `${shares[i]}%` : ''}</div>`).join('');
  const handles = [55, 90].map((left) => `<div class="mixer-split-handle" role="slider" tabindex="0" style="left:${left}%"></div>`).join('');
  const legend = bowl.map((t, i) => `<li><span class="mixer-dot" style="background:var(--composition-${i + 1})" aria-hidden></span>${ROLES[i]}: <b>${esc(t.brand)} ${esc(t.name)}</b>, ${shares[i]}%</li>`).join('');
  const meters = [['Сладость', 52], ['Кислинка', 46], ['Свежесть', 63], ['Плотность', 38]]
    .map(([label, w]) => `<div class="mixer-meter"><span class="mixer-meter-label">${label}</span><span class="mixer-meter-track"><span style="width:${w}%"></span></span></div>`).join('');
  return `<div class="mixer-progress">
      <div class="mixer-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3"><span style="width:100%"></span></div>
    </div>
    <div class="mixer-reveal">
      <div class="mixer-reveal-card">
        <div class="mixer-reveal-head">
          ${ring(bowl, '<span class="mixer-ring-score">79</span>')}
          <div class="mixer-reveal-verdict"><h2 class="aroma-label">Гармония</h2><span class="mixer-verdict">Классическое сочетание</span></div>
        </div>
        <label class="mixer-name-field"><span class="aroma-label">Название</span>
          <textarea class="mixer-name-input" rows="1" aria-label="Название микса" spellcheck="false" style="height:36px">${esc(draftName(bowl))}</textarea></label>
      </div>
      <div class="mixer-split"><h2 class="aroma-label">Доли</h2><div class="mixer-split-bar">${segs}${handles}</div><ul class="mixer-split-legend">${legend}</ul></div>
      <div class="mixer-meters">${meters}</div>
      <p class="mixer-similar-line">Похожих миксов в каталоге нет.</p>
    </div>
    <div class="mixer-dock">
      <button type="button" style="width:100%;border:1px solid var(--cta-solid-border);background:var(--cta-solid);color:var(--cta-solid-ink);border-radius:var(--r-guest-cta);min-height:52px;padding:0 18px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;cursor:pointer;box-shadow:var(--cta-solid-shadow)">Покурить</button>
      <button type="button" class="mixer-link">Собрать заново</button>
    </div>`;
}

function glyph(profiles, size) {
  const pos = [{ l: 8, t: 8, s: 26, o: 0.92 }, { l: 22, t: 22, s: 24, o: 0.78 }, { l: 14, t: 28, s: 18, o: 0.62 }];
  const k = size / 56;
  const orbs = profiles.slice(0, 3).map((p, i) => {
    const c = PROFILE[p];
    return `<span style="position:absolute;left:${pos[i].l * k}px;top:${pos[i].t * k}px;width:${pos[i].s * k}px;height:${pos[i].s * k}px;border-radius:var(--r-pill);background:radial-gradient(circle at 30% 30%, ${c} 0%, ${c}66 70%, transparent 100%);opacity:${pos[i].o};mix-blend-mode:screen;filter:blur(2px)"></span>`;
  }).join('');
  return `<div aria-hidden style="width:${size}px;height:${size}px;border-radius:var(--r-guest-glyph);background:var(--bg-base);border:1px solid var(--line-soft);position:relative;flex:0 0 auto;overflow:hidden">${orbs}</div>`;
}

// Карточка для мастера после «Покурить»: подача как у карточки микса в мокапе #348,
// вместо строки профилей плашка «Собран гостем, гармония N».
function masterCard() {
  const bowl = [T.peach, T.bitter, T.mint];
  const profiles = ['fruity', 'citrus', 'sour'];
  const bar = profiles.map((p) => `<span style="flex:1;background:${PROFILE[p]}"></span>`).join('');
  const rows = bowl.map((t, i) => `<li class="aroma-confirm-row">
      <span class="aroma-confirm-row-text"><span class="aroma-confirm-row-name">${esc(t.name)}</span><span class="aroma-confirm-row-meta">${esc(t.brand)}, ${ROLES[i].toLowerCase()}</span></span>
      <span class="aroma-confirm-row-share">${SHARES[3][i]}%</span></li>`).join('');
  return `<section class="aroma-confirm mixer-master-card">
    <div class="aroma-confirm-topbar"><p class="aroma-confirm-note">Покажите мастеру</p><button type="button" class="aroma-confirm-done">Готово</button></div>
    <div class="aroma-confirm-stack">
      ${glyph(profiles, 96)}
      <h1 class="aroma-confirm-title">${esc(draftName(bowl))}</h1>
      <span class="mixer-verdict">Собран гостем, гармония 79</span>
      <div aria-hidden style="display:flex;width:100%;height:3px;border-radius:999px;overflow:hidden">${bar}</div>
    </div>
    <ul class="aroma-confirm-composition" aria-label="Состав">${rows}</ul>
  </section>`;
}

function bottomNav(active = 'mixer') {
  const items = NAV.map(([id, label, icon]) => `<button type="button" class="bottom-nav-item" aria-label="${label}" ${id === active ? 'aria-current="page"' : ''}><i data-lucide="${icon}" stroke-width="${id === active ? 2.1 : 1.8}" aria-hidden="true"></i></button>`).join('');
  return `<nav class="bottom-nav" aria-label="Гостевая навигация" style="grid-template-columns:repeat(${NAV.length}, minmax(0, 1fr))">${items}</nav>`;
}

// Экраны: что рендерит один телефон. nav — видна ли нижняя панель.
const SCREENS = {
  'base': { nav: true, hl: true, body: () => swipe(TURN_STATE.base) },
  'accent': { nav: true, hl: true, body: () => swipe(TURN_STATE.accent) },
  'twist': { nav: true, hl: true, body: () => swipe(TURN_STATE.twist) },
  'reveal': { nav: true, hl: true, body: reveal },
  'master-nav': { nav: true, master: true },
  'master-full': { nav: false, master: true },
  'base-line': { nav: true, body: () => swipe({ ...TURN_STATE.base, line: LINE_BASE }) },
  'twist-line': { nav: true, body: () => swipe({ ...TURN_STATE.twist, line: LINE_TWIST }) },
  'base-now': { nav: false, body: () => swipe(TURN_STATE.base) },
  'twist-now-line': { nav: false, body: () => swipe({ ...TURN_STATE.twist, line: LINE_TWIST }) },
};

function renderScreen(id) {
  const s = SCREENS[id] ?? SCREENS.base;
  const mixer = s.master
    ? `<section class="mixer">${masterCard()}</section>`
    : `<section class="mixer" aria-labelledby="mixer-title">${topbar(s.hl)}${s.body()}</section>`;
  document.getElementById('root').innerHTML = `<div class="app-bg"><div class="phone-shell">${mixer}${s.nav ? bottomNav() : ''}</div></div>`;
  lucide.createIcons();
  // Отчёт для доски: помещается ли экран свайпов в высоту. Считается по запросу,
  // после загрузки шрифтов: с запасным шрифтом строки короче и места кажется больше.
  window.__fit = () => {
    const swipeEl = document.querySelector('.mixer-swipe');
    if (!swipeEl) return null;
    const slot = document.querySelector('.mixer-deck-slot').getBoundingClientRect().height;
    const last = document.querySelector('.mixer-links').getBoundingClientRect().bottom;
    const limit = swipeEl.getBoundingClientRect().bottom - parseFloat(getComputedStyle(swipeEl).paddingBottom);
    return { deck: Math.round(slot), clipped: Math.max(0, Math.round(last - limit)) };
  };
}

// Доска: каждый телефон — iframe нужной высоты, поэтому media (max-height: 740px) и
// container-запросы срабатывают так же, как на реальном экране.
const FRAMES = {
  'base-812': ['base', 812, 'Шаг основы', '<b>Назад</b> ведёт на экран, откуда гость открыл Намиксуй. Отменять нечего.'],
  'accent-812': ['accent', 812, 'Шаг акцента', '<b>Назад</b> возвращает выбор основы. Персик снимается из чаши, колода основы начинается сначала, полки из подбора.'],
  'twist-812': ['twist', 812, 'Шаг штриха', '<b>Назад</b> возвращает выбор акцента. В чаше остаётся одна основа, как на экране слева.'],
  'reveal-812': ['reveal', 812, 'Раскрытие', '<b>Назад</b> возвращает шаг штриха с двумя табаками. Так же после «Без штриха» и «Доверюсь мастеру».'],
  'base-667': ['base', 667, 'Основа', 'Реплик мастера пока нет (#128). Так экран будет выглядеть сразу после выкатки.', true],
  'accent-667': ['accent', 667, 'Акцент', '', true],
  'twist-667': ['twist', 667, 'Штрих', 'Три ссылки в одну строку: просвет между ними 12 px вместо 16.', true],
  'reveal-667': ['reveal', 667, 'Раскрытие', 'Покурить стоит над панелью, состав прокручивается под ним.', true],
  'base-line-667': ['base-line', 667, 'Основа и реплика', 'Двухстрочная реплика мастера, когда владелец заполнит тексты #128.', true],
  'twist-line-667': ['twist-line', 667, 'Штрих и реплика', 'Худший случай: реплика и три ссылки.', true],
  'twist-line-raw-667': ['twist-line', 667, 'Без уплотнения', 'Тот же экран с нынешними отступами хода 10 и 8 px.'],
  'twist-now-line-667': ['twist-now-line', 667, 'Без панели', 'Для сравнения: худший случай без панели.'],
  'base-now-548': ['base-now', 548, 'iPhone SE в Safari, без панели', 'С панелями браузера экран 375×548.'],
  'base-548': ['base', 548, 'iPhone SE в Safari, с панелью', 'Вне scope #350, отдельная задача.', true],
  'master-nav-812': ['master-nav', 812, 'Вариант А, с панелью', 'Готово ведёт туда, откуда пришли. Из панели можно уйти в любой раздел.'],
  'master-full-812': ['master-full', 812, 'Вариант Б, без панели', 'Как сейчас и как у карточки микса из каталога. Выход один, кнопка Готово. <b>Рекомендуем.</b>'],
  'master-nav-667': ['master-nav', 667, 'Вариант А', 'Помещается целиком и с панелью.'],
  'master-full-667': ['master-full', 667, 'Вариант Б', ''],
};

function frame(key) {
  const [screen, h, name, note, compact] = FRAMES[key];
  return `<div class="frame" data-frame="${key}">
    <p class="frame-name"><b>${name}</b><span>375×${h}</span><span class="fit" hidden></span></p>
    <iframe src="mockups.html#screen=${screen}${compact ? '&compact=1' : ''}" height="${h}" title="${esc(name)}" loading="eager"></iframe>
    ${note ? `<p class="frame-note">${note}</p>` : ''}
  </div>`;
}
const arrow = (text) => `<div class="flow-arrow"><span>←</span><span>${text}</span></div>`;

function renderBoard() {
  document.getElementById('root').innerHTML = `<div class="board">
    <header>
      <h1>Намиксуй с нижней панелью и пошаговым Назад (#350)</h1>
      <p class="board-lead">На экране видна нижняя панель гостя, активен Миксер. Стрелка в шапке отменяет прошлый ход.
      На шаге основы она ведёт туда, откуда гость пришёл. Уход через панель посреди сборки сбрасывает чашу.
      Экран свёрстан на живом <code>mixer.css</code> с правками среза G3 (#361) по канону #348.
      Каждая рамка — iframe точного размера. Подсвечена стрелка Назад.</p>
    </header>

    <section class="board-section">
      <h2>Ходы сборки, 375×812</h2>
      <p class="board-lead">Читать справа налево. Каждое Назад отменяет один ход, и в чаше становится на табак меньше.</p>
      <div class="board-row">
        <div class="flow-arrow"><span>←</span><span>прошлый экран</span></div>
        ${frame('base-812')}${arrow('Назад')}${frame('accent-812')}${arrow('Назад')}${frame('twist-812')}${arrow('Назад')}${frame('reveal-812')}
      </div>
    </section>

    <section class="board-section">
      <h2>Проверка высоты, 375×667</h2>
      <p class="board-lead">Помещаются ли вместе с панелью колода, кнопки Беру и Дальше, ссылки и чаша. Метка над
      телефоном показывает высоту колоды и сколько обрезано снизу. Колоде нужно не меньше 200 px.</p>
      <div class="board-row">${frame('base-667')}${frame('accent-667')}${frame('twist-667')}${frame('reveal-667')}</div>
      <p class="board-lead">Худший случай: двухстрочная реплика мастера (#128). На высоте до 740 px отступы хода
      6 px вместо 10 и 8. Справа тот же экран с нынешними отступами и без панели.</p>
      <div class="board-row">${frame('base-line-667')}${frame('twist-line-667')}${frame('twist-line-raw-667')}${frame('twist-now-line-667')}</div>
      <p class="board-lead">Вне scope: iPhone SE в Safari с панелями браузера.</p>
      <div class="board-row">${frame('base-now-548')}${frame('base-548')}</div>
    </section>

    <section class="board-section">
      <h2>Покажите мастеру: решает владелец</h2>
      <p class="board-lead">Готово работает как раньше. Вопрос один: видна ли на карточке панель.</p>
      <div class="board-row">${frame('master-nav-812')}${frame('master-full-812')}${frame('master-nav-667')}${frame('master-full-667')}</div>
    </section>
  </div>`;
  document.querySelectorAll('.frame iframe').forEach((iframe) => {
    iframe.addEventListener('load', () => {
      const report = () => {
        const fit = iframe.contentWindow.__fit();
        const badge = iframe.closest('.frame').querySelector('.fit');
        if (!fit) return;
        badge.hidden = false;
        badge.dataset.ok = String(fit.clipped === 0 && fit.deck >= 200);
        badge.textContent = fit.clipped ? `колода ${fit.deck} px, обрезано ${fit.clipped} px` : `колода ${fit.deck} px`;
      };
      const fonts = iframe.contentWindow.document.fonts;
      fonts.ready.then(() => setTimeout(report, 1200));
      fonts.addEventListener('loadingdone', () => setTimeout(report, 50));
    });
  });
}

// #shot=<frame> — один телефон без доски, для скриншотов в issue и PR.
function renderShot(key) {
  const [screen, h, name, , compact] = FRAMES[key] ?? FRAMES['base-812'];
  document.getElementById('root').innerHTML = `<div class="shot"><iframe src="mockups.html#screen=${screen}${compact ? '&compact=1' : ''}" height="${h}" title="${esc(name)}"></iframe></div>`;
}

function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get('compact') === '1') document.body.dataset.compact = '';
  else delete document.body.dataset.compact;
  if (params.get('screen')) renderScreen(params.get('screen'));
  else if (params.get('shot')) renderShot(params.get('shot'));
  else renderBoard();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
