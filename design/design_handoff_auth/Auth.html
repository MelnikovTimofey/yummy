<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomad Master · Вход</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/styles.css" />

  <style>
    /* ============================================================
       Auth page — centered single card
       ============================================================ */

    html, body {
      height: 100%;
    }

    body.auth-body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(
          ellipse 80% 60% at 50% 0%,
          oklch(0.22 0.018 38 / 0.9),
          transparent 70%
        ),
        var(--bg-base);
    }

    /* Subtle grain / dotted texture — kept very faint */
    body.auth-body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(oklch(0.4 0.014 45 / 0.16) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 30%, transparent 100%);
    }

    .auth {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Brand row */
    .auth__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      color: var(--text-secondary);
    }

    .auth__mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--accent), oklch(0.5 0.12 30));
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-fg);
      box-shadow:
        0 1px 0 oklch(0 0 0 / 0.4),
        0 0 0 1px oklch(0.66 0.13 38 / 0.3),
        0 8px 24px -10px oklch(0.66 0.13 38 / 0.5);
    }

    .auth__brand-name {
      font-family: var(--font-serif);
      font-size: 15px;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .auth__brand-name em {
      color: var(--text-muted);
      font-style: normal;
      font-weight: 400;
    }

    /* Card */
    .auth__card {
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-xl);
      padding: 32px 32px 28px;
      box-shadow:
        0 1px 0 oklch(1 0 0 / 0.03) inset,
        var(--shadow-lg);
    }

    .auth__title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--text-primary);
      text-wrap: pretty;
    }

    .auth__subtitle {
      margin: 6px 0 24px;
      font-size: var(--fs-md);
      color: var(--text-muted);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .auth__form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth__field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .auth__input {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 12px;
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: var(--r-md);
      color: var(--text-primary);
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
      font-size: var(--fs-lg);
    }

    .auth__input:focus-within {
      border-color: var(--accent-border);
      background: oklch(0.16 0.012 45);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .auth__input input {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      color: inherit;
      font-family: var(--font-mono);
      font-size: 15px;
      letter-spacing: 0.01em;
    }

    .auth__input input::placeholder {
      color: var(--text-faint);
    }

    .auth__reveal {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: var(--r-sm);
      color: var(--text-muted);
      transition: background 120ms ease, color 120ms ease;
      flex-shrink: 0;
    }

    .auth__reveal:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .auth__reveal:focus-visible {
      outline: 2px solid var(--accent-border);
      outline-offset: 1px;
    }

    /* Caps-lock hint */
    .auth__caps {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--warning);
    }

    .auth__caps[data-on="true"] {
      display: inline-flex;
    }

    .auth__caps-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--warning);
      box-shadow: 0 0 0 3px var(--warning-soft);
    }

    /* Submit */
    .auth__submit {
      margin-top: 10px;
      height: 46px;
      width: 100%;
      border-radius: var(--r-md);
      background: var(--accent);
      color: var(--accent-fg);
      font-size: var(--fs-lg);
      font-weight: 500;
      border: 1px solid var(--accent);
      transition: background 120ms ease, border-color 120ms ease, transform 100ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-sans);
    }

    .auth__submit:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .auth__submit:active {
      transform: translateY(1px);
    }

    .auth__submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .auth__submit .icon {
      width: 16px;
      height: 16px;
    }

    /* Error */
    .auth__error {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--danger-soft);
      border: 1px solid oklch(0.66 0.18 25 / 0.45);
      border-radius: var(--r-md);
      color: oklch(0.85 0.12 25);
      font-size: var(--fs-md);
    }

    .auth__error[data-on="true"] {
      display: flex;
    }

    /* Footer */
    .auth__foot {
      text-align: center;
      color: var(--text-faint);
      font-size: var(--fs-sm);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }

    .auth__foot a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 120ms ease;
    }

    .auth__foot a:hover {
      color: var(--text-secondary);
    }

    @media (max-width: 460px) {
      .auth__card {
        padding: 24px 22px 22px;
      }
      .auth__title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body class="auth-body">
  <main class="auth" role="main">
    <div class="auth__brand" aria-label="Nomad Master">
      <div class="auth__mark" aria-hidden="true">N</div>
      <div class="auth__brand-name">Nomad <em>Master</em></div>
    </div>

    <section class="auth__card">
      <h1 class="auth__title">Войти в смену</h1>
      <p class="auth__subtitle">Операционная консоль для кальянных мастеров и администраторов.</p>

      <form class="auth__form" id="authForm" autocomplete="on" novalidate>
        <div>
          <div class="auth__field-label">
            <span>Логин</span>
          </div>
          <label class="auth__input">
            <svg class="icon lucide" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="login"
              name="username"
              type="text"
              autocomplete="username"
              spellcheck="false"
              autocapitalize="none"
              placeholder="admin"
              required
              autofocus
            />
          </label>
        </div>

        <div>
          <div class="auth__field-label">
            <span>Пароль</span>
          </div>
          <label class="auth__input">
            <svg class="icon lucide" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              id="revealBtn"
              class="auth__reveal"
              aria-label="Показать пароль"
              aria-pressed="false"
              title="Показать пароль"
            >
              <!-- Eye (default) -->
              <svg id="eyeShow" class="lucide" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off -->
              <svg id="eyeHide" class="lucide" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="display:none">
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.16 17.16 0 0 1-3.17 4.19"></path>
                <path d="M6.61 6.61A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.9 10.9 0 0 0 5.39-1.39"></path>
                <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"></path>
                <path d="M3 3l18 18"></path>
              </svg>
            </button>
          </label>
          <div class="auth__caps" id="capsHint" data-on="false">
            <span class="auth__caps-dot"></span>
            <span>Включён Caps Lock</span>
          </div>
        </div>

        <div class="auth__error" id="authError" data-on="false" role="alert">
          <svg class="lucide" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="margin-top:2px;flex-shrink:0">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
          <span id="authErrorText">Неверный логин или пароль</span>
        </div>

        <button type="submit" class="auth__submit" id="submitBtn">
          <span id="submitLabel">Войти</span>
          <svg class="icon lucide" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="M13 5l7 7-7 7"></path>
          </svg>
        </button>
      </form>
    </section>

    <div class="auth__foot">v2.4.0 · <a href="#">помощь</a></div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('authForm');
      const pwd = document.getElementById('password');
      const login = document.getElementById('login');
      const revealBtn = document.getElementById('revealBtn');
      const eyeShow = document.getElementById('eyeShow');
      const eyeHide = document.getElementById('eyeHide');
      const capsHint = document.getElementById('capsHint');
      const authError = document.getElementById('authError');
      const authErrorText = document.getElementById('authErrorText');
      const submitBtn = document.getElementById('submitBtn');
      const submitLabel = document.getElementById('submitLabel');

      // Toggle password visibility
      revealBtn.addEventListener('click', function () {
        const showing = pwd.type === 'text';
        pwd.type = showing ? 'password' : 'text';
        revealBtn.setAttribute('aria-pressed', String(!showing));
        revealBtn.setAttribute(
          'aria-label',
          showing ? 'Показать пароль' : 'Скрыть пароль'
        );
        revealBtn.title = showing ? 'Показать пароль' : 'Скрыть пароль';
        eyeShow.style.display = showing ? '' : 'none';
        eyeHide.style.display = showing ? 'none' : '';
        // Keep focus + caret position
        pwd.focus({ preventScroll: true });
      });

      // Caps lock indicator
      function checkCaps(e) {
        if (typeof e.getModifierState === 'function') {
          capsHint.dataset.on = String(e.getModifierState('CapsLock'));
        }
      }
      pwd.addEventListener('keydown', checkCaps);
      pwd.addEventListener('keyup', checkCaps);
      pwd.addEventListener('blur', function () {
        capsHint.dataset.on = 'false';
      });

      // Hide error on edit
      [login, pwd].forEach(function (el) {
        el.addEventListener('input', function () {
          authError.dataset.on = 'false';
        });
      });

      // Demo submit (no real backend)
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        authError.dataset.on = 'false';
        const u = login.value.trim();
        const p = pwd.value;

        if (!u || !p) {
          authErrorText.textContent = 'Введите логин и пароль';
          authError.dataset.on = 'true';
          return;
        }

        submitBtn.disabled = true;
        submitLabel.textContent = 'Проверяем…';

        setTimeout(function () {
          // Accept admin/admin or nomad/nomad as demo
          const ok =
            (u === 'admin' && p === 'admin') ||
            (u === 'nomad' && p === 'nomad');
          if (ok) {
            submitLabel.textContent = 'Готово';
            // In real app: navigate to dashboard
            setTimeout(function () {
              submitBtn.disabled = false;
              submitLabel.textContent = 'Войти';
            }, 700);
          } else {
            submitBtn.disabled = false;
            submitLabel.textContent = 'Войти';
            authErrorText.textContent = 'Неверный логин или пароль';
            authError.dataset.on = 'true';
            pwd.select();
          }
        }, 500);
      });
    })();
  </script>
</body>
</html>
