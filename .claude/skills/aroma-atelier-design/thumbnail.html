<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.main{background:#b04a3e;display:grid;place-items:center;gap:0;padding:0 40px}
.stack{display:grid;justify-items:center;gap:26px}
.wm{font-family:var(--font-display);font-size:96px;line-height:.94;color:#f7ede2;text-align:center}
.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}
.strip span{display:block}</style></head>
<body><div class="tile">
<div class="main"><div class="stack"><img src="assets/logo-mark-light.svg" width="220" height="220" alt=""><div class="wm">Арома<br>Ателье</div></div></div>
<div class="strip"><span style="background:#c2a24e"></span><span style="background:#6e9a6a"></span><span style="background:#5e7e96"></span><span style="background:#7e342b"></span></div>
</div></body></html>
