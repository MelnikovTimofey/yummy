<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--accent)"><span class="n" style="color:var(--accent-fg)">--accent</span><span class="v" style="color:var(--accent-fg)">#B04A3E</span></div>
<div class="sw" style="background:var(--accent-hover)"><span class="n" style="color:var(--accent-fg)">--accent-hover</span><span class="v" style="color:var(--accent-fg)">#C25749</span></div>
<div class="sw" style="background:var(--accent-deep)"><span class="n" style="color:var(--accent-fg)">--accent-deep</span><span class="v" style="color:var(--accent-fg)">#7E342B</span></div>
<div class="sw" style="background:var(--accent-soft);border-color:var(--accent-border)"><span class="n" style="color:var(--accent)">--accent-soft</span><span class="v" style="color:var(--accent)">accent / 15%</span></div>
<div class="sw" style="background:var(--cta-gradient)"><span class="n" style="color:var(--accent-fg)">--cta-gradient</span><span class="v" style="color:var(--accent-fg)">135° accent → deep</span></div>
</div></body></html>
