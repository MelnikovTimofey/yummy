<!-- @dsCard group="Spacing" viewport="700x170" name="Density in use" subtitle="Console row 36–44px vs guest tap target 44–52px" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div>
<p class="lbl">Console (Мастер)</p>
<div style="border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-raised)">
<div style="height:32px;padding:0 12px;display:flex;align-items:center;font-family:var(--font-meta);font-size:10.5px;letter-spacing:.1em;color:var(--text-muted);border-bottom:1px solid var(--border-subtle)">ТАБАК</div>
<div style="min-height:44px;padding:6px 12px;display:flex;align-items:center;font-size:14px;border-bottom:1px solid var(--border-subtle)">Wildberry</div>
<div style="min-height:44px;padding:6px 12px;display:flex;align-items:center;font-size:14px">Red Tea</div>
</div></div>
<div>
<p class="lbl">Guest (Арома Ателье)</p>
<div style="display:grid;gap:8px">
<div style="min-height:44px;border:1px solid var(--border-subtle);border-radius:var(--r-guest-row);background:var(--guest-row-bg);padding:10px 12px;font-family:var(--font-display);font-size:14.5px">Морозная ягода</div>
<div style="min-height:52px;border:1px solid var(--cta-solid-border);border-radius:var(--r-guest-cta);background:var(--cta-solid);color:var(--cta-solid-ink);display:grid;place-items:center;font-family:var(--font-body);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600">Покурить</div>
</div></div></div></body></html>
