<!-- @dsCard group="Colors" viewport="700x120" name="Borders" subtitle="Warm grey hairlines at 16 / 26 / 40% — never solid strokes" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--bg-raised);border:1px solid var(--border-subtle)"><span class="n">--border-subtle</span><span class="v">0.16 · cards, tables</span></div>
<div class="sw" style="background:var(--bg-raised);border:1px solid var(--border-default)"><span class="n">--border-default</span><span class="v">0.26 · controls</span></div>
<div class="sw" style="background:var(--bg-raised);border:1px solid var(--border-strong)"><span class="n">--border-strong</span><span class="v">0.40 · hover</span></div>
<div class="sw" style="background:var(--bg-raised);border:1px solid var(--accent-border)"><span class="n" style="color:var(--accent)">--accent-border</span><span class="v" style="color:var(--accent)">0.40 · focus</span></div>
</div></body></html>
