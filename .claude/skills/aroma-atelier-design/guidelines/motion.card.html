<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="Ember pulse on the one next action; 120ms state changes" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;gap:18px;align-items:center">
<button class="cta-pulse" style="border:1px solid var(--cta-solid-border);background:var(--cta-solid);color:var(--cta-solid-ink);border-radius:var(--r-guest-cta);min-height:52px;padding:0 22px;font-family:var(--font-body);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600">Покурить</button>
<div style="display:grid;gap:4px" class="v">
<span>aroma-ember · 1.6s ease-out infinite · guest CTA only</span>
<span>--dur-fast 120ms · hover / active state changes</span>
<span>--dur-sheet 240ms · bottom sheet in, --ease-spring on release</span>
<span>prefers-reduced-motion: pulse and sheet animation off</span>
</div></div></body></html>
