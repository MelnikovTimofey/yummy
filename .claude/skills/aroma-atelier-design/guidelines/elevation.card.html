<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Deep soft shadows + 1px lit top edge; no material layers" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row" style="height:120px;align-items:center">
<div class="sw" style="background:var(--bg-raised);box-shadow:var(--shadow-sm)"><span class="n">--shadow-sm</span></div>
<div class="sw" style="background:var(--bg-raised);box-shadow:var(--shadow-md)"><span class="n">--shadow-md</span></div>
<div class="sw" style="background:var(--bg-raised);box-shadow:var(--shadow-lg)"><span class="n">--shadow-lg</span></div>
<div class="sw" style="background:var(--guest-card-bg);box-shadow:var(--shadow-guest-card);border-radius:var(--r-guest-card)"><span class="n">--shadow-guest-card</span><span class="v">+ inner highlight</span></div>
</div></body></html>
