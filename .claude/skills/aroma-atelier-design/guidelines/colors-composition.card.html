<!-- @dsCard group="Colors" viewport="700x120" name="Composition ramp" subtitle="Mix recipe stack — brass, wine, herb, mint" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)">
<span style="flex:4;background:var(--composition-1)"></span><span style="flex:5;background:var(--composition-2)"></span><span style="flex:1;background:var(--composition-3)"></span></div>
<div class="row" style="margin-top:10px">
<div class="sw" style="min-height:40px;background:var(--composition-1)"><span class="n" style="color:#1b1010">--composition-1</span></div><div class="sw" style="min-height:40px;background:var(--composition-2)"><span class="n" style="color:#1b1010">--composition-2</span></div><div class="sw" style="min-height:40px;background:var(--composition-3)"><span class="n" style="color:#1b1010">--composition-3</span></div><div class="sw" style="min-height:40px;background:var(--composition-4)"><span class="n" style="color:#1b1010">--composition-4</span></div><div class="sw" style="min-height:40px;background:var(--composition-5)"><span class="n" style="color:#1b1010">--composition-5</span></div>
</div></body></html>
