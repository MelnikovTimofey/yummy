<!-- @dsCard group="Brand" viewport="700x150" name="Iconography · Lucide" subtitle="Lucide 14–16px, stroke 1.8–1.9, --text-muted until active" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.js"></script>
<div style="display:flex;gap:18px;align-items:center;color:var(--text-secondary)">
<i data-lucide="layout-dashboard"></i><i data-lucide="warehouse"></i><i data-lucide="blend"></i><i data-lucide="gallery-vertical-end"></i><i data-lucide="shield-check"></i><i data-lucide="search"></i><i data-lucide="log-out"></i><i data-lucide="flame"></i><i data-lucide="star"></i><i data-lucide="triangle-alert"></i><i data-lucide="chevron-down"></i><i data-lucide="plus"></i>
</div>
<p class="v" style="margin-top:14px">Оба приложения объявляют iconLibrary: lucide. Активная иконка таба — цвет --accent. Emoji и unicode-иконки не используются; исключения — ★ в RatingPill, ← в guest-навигации, ✓ в 18+ чекбоксе.</p>
<script>lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.9}})</script></body></html>
