<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Muted register: success, warning, danger, info — with their soft washes" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--success)"><span class="n" style="color:#0f130f">--success #6E9A6A</span></div>
<div class="sw" style="background:var(--warning)"><span class="n" style="color:#17140a">--warning #C2A24E</span></div>
<div class="sw" style="background:var(--danger)"><span class="n" style="color:#fff">--danger #CF4F44</span></div>
<div class="sw" style="background:var(--info)"><span class="n" style="color:#0b1016">--info #5E7E96</span></div>
</div>
<div class="row" style="margin-top:8px">
<div class="sw" style="min-height:34px;background:var(--success-soft)"><span class="n" style="color:var(--success)">--success-soft</span></div>
<div class="sw" style="min-height:34px;background:var(--warning-soft)"><span class="n" style="color:var(--warning)">--warning-soft</span></div>
<div class="sw" style="min-height:34px;background:var(--danger-soft)"><span class="n" style="color:var(--danger)">--danger-soft</span></div>
<div class="sw" style="min-height:34px;background:var(--info-soft)"><span class="n" style="color:var(--info)">--info-soft</span></div>
</div></body></html>
