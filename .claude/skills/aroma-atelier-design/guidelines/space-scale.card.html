<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.b{background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:var(--r-xs);height:34px}</style></head><body>
<div style="display:flex;gap:10px;align-items:flex-end">
<div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-1)"></div><span class="v">4</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-2)"></div><span class="v">8</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-3)"></div><span class="v">12</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-4)"></div><span class="v">16</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-5)"></div><span class="v">20</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-6)"></div><span class="v">24</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-8)"></div><span class="v">32</span></div><div style="display:grid;gap:6px;justify-items:center"><div class="b" style="width:var(--space-10)"></div><span class="v">40</span></div>
</div>
<p class="v" style="margin-top:10px">Guest gutters 20px (12px под 480px) · console panels 16px · list cells 12px</p></body></html>
