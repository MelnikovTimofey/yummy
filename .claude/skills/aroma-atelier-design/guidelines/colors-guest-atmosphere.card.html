<!-- @dsCard group="Colors" viewport="700x150" name="Guest atmosphere" subtitle="Оксбладные гало, винные градиенты карточек и листа, сплошной CTA" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="row" style="height:110px">
<div class="sw" style="background:var(--guest-room-bg),var(--guest-halo-strong)"><span class="n">--guest-room-bg + halo</span></div>
<div class="sw" style="background:var(--guest-card-bg);box-shadow:var(--shadow-guest-card)"><span class="n">--guest-card-bg</span></div>
<div class="sw" style="background:var(--guest-sheet-bg)"><span class="n">--guest-sheet-bg</span></div>
<div class="sw" style="background:var(--cta-solid);border-color:var(--cta-solid-border)"><span class="n" style="color:var(--cta-solid-ink)">--cta-solid</span></div>
</div></body></html>
