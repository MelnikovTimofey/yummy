<!-- @dsCard group="Type" viewport="700x130" name="Numerals" subtitle="Tabular everywhere; Russian decimal comma; % and shares in accent" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.row{display:flex;gap:8px;align-items:stretch}.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border-subtle);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:74px}
.n{font-family:var(--font-meta);font-size:10px;letter-spacing:.06em;color:var(--text-secondary)}.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.lbl{font-family:var(--font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;gap:26px;align-items:baseline;font-variant-numeric:tabular-nums">
<span style="font-family:var(--font-serif);font-size:28px">11 505</span>
<span style="font-family:var(--font-body);font-size:22px;color:var(--accent-hover)">40%</span>
<span style="font-family:var(--font-body);font-size:22px;color:var(--accent-hover)">12,5%</span>
<span style="font-family:var(--font-body);font-size:16px;color:var(--rating-ink)">★ 4,6</span>
<span style="font-family:var(--font-meta);font-size:22px;letter-spacing:.04em">4821</span>
</div>
<p class="v" style="margin-top:12px">Ratings and shares always use a comma; thousands use a thin space.</p></body></html>
