<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--bg-base);font-family:var(--font-sans);color:var(--text-primary)}
.lbl{font-family:var(--font-meta);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-xs);background:var(--bg-elevated);border:1px solid var(--border-default);border-bottom-width:2px;font-family:var(--font-meta);font-size:10.5px;font-weight:500;color:var(--text-muted)}</style></head>
<body><p class="lbl">--font-meta · monospace в системе не используется</p>
<div style="display:grid;gap:9px;margin-top:10px">
<span style="font-family:var(--font-meta);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)">МЕНЕДЖЕР МИКСОВ</span>
<span style="font-family:var(--font-meta);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)">ТАБАК · ПРОИЗВОДИТЕЛЬ · НАЛИЧИЕ</span>
<span style="font-family:var(--font-meta);font-size:24px;font-weight:500;letter-spacing:.14em;font-variant-numeric:tabular-nums">4821</span>
<span style="display:flex;align-items:center;gap:8px"><span class="kbd">⌘K</span><span class="v">kbd · табличные цифры дают выравнивание вместо моноширины</span></span>
</div></body></html>
