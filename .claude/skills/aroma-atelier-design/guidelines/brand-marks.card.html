<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-base);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tile{border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-raised);display:grid;place-items:center;padding:12px}
.ox{background:var(--accent)}
.v{font-family:var(--font-meta);font-size:10px;color:var(--text-faint);margin-top:8px;display:block}</style></head>
<body>
<div class="row">
<div class="tile"><img src="../assets/logo-mark.svg" width="64" height="64" alt="Арома Ателье"></div>
<div class="tile"><img src="../assets/logo-mark.svg" width="28" height="28" alt=""></div>
<div class="tile ox"><img src="../assets/logo-mark-light.svg" width="56" height="56" alt=""></div>
<div class="tile" style="padding:14px 18px"><img src="../assets/logo-lockup.svg" width="300" alt="Арома Ателье"></div>
<div style="display:grid;gap:6px">
<span style="font-family:var(--font-serif);font-size:15px;letter-spacing:.02em;color:var(--text-primary)">Ателье · Мастер</span>
<span class="aroma-caps" style="letter-spacing:var(--caps-tracking-wide)">подбор кальянных миксов</span>
</div></div>
<span class="v">logo-mark.svg (тёмная плитка) · logo-mark-light.svg (на оксбладе) · logo-mark-oxblood.svg (без плитки) · logo-lockup.svg · favicon.svg — минимум 24px, поля не меньше высоты одной струи</span>
</body></html>
