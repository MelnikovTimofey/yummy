<!-- @dsCard group="Арома Ателье · Guest" viewport="430x780" name="Гостевое приложение" subtitle="18+ gate → знакомство → онбординг → нижняя панель: подбор / витрина / рилсы / каталог / миксер / кабинет → карточка" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Гостевой UI-кит Арома Ателье</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body,#root{margin:0;height:100%;width:100%}
body{font-family:var(--font-body);color:var(--text-primary);overflow-x:hidden;background:var(--guest-room-bg)}
/* Атмосфера — одно табачное гало сверху по центру; halo-кругов по углам нет (#348) */
.app-bg{min-height:100dvh;width:100%;display:grid;place-items:center;padding:16px;position:relative;overflow:hidden;background:var(--guest-halo-strong),linear-gradient(180deg,rgba(15,15,18,.94) 0%,rgba(20,20,23,1) 100%)}
.phone-shell{width:min(calc(100vw - 32px),430px);height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:var(--r-guest-shell);background:var(--guest-shell-bg);box-shadow:var(--shadow-guest-shell);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2}
.topbar{display:grid;gap:8px;padding:6px 10px 6px 20px;border-bottom:1px solid var(--line);background:var(--guest-topbar-bg);position:sticky;top:0;z-index:20;box-shadow:0 12px 28px rgba(0,0,0,.18);backdrop-filter:blur(18px)}
.topbar-main-row{display:flex;align-items:center;gap:12px;width:100%}
.brand-home-btn{border:0;background:transparent;padding:0;min-height:40px;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand-mark{width:auto;height:22px;flex:0 0 auto}
.brand{margin:0;font-family:var(--font-display);font-size:19px;line-height:1;letter-spacing:.01em;color:var(--text-0);white-space:nowrap}
.guest-stage-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.content{padding:12px 20px;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-height:0;flex:1 1 auto;align-content:start;scrollbar-width:thin;scrollbar-color:#3A3A40 #1A1A1D}
.content-intro{padding:0;gap:0}
.guest-status{margin:0;color:var(--text-1);font-size:15px}
.guest-error{margin:0;color:var(--danger);font-size:12px;text-align:center}
.guest-ok{margin:0;color:var(--text-primary);font-size:12px}
/* Вторичные кнопки — sentence case: UPPERCASE в гостевом интерфейсе только у AromaCTA (#348) */
.aroma-skip{background:transparent;border:0;color:var(--text-2);font-family:var(--font-body);font-size:13px;padding:4px;cursor:pointer}
.aroma-ghost{border:1px solid var(--line);background:rgba(40,40,48,.5);color:var(--text-0);border-radius:var(--r-guest-control);min-height:48px;padding:0 18px;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer}
.aroma-ghost-sm{border:1px solid var(--line);background:rgba(40,40,48,.54);color:var(--text-0);border-radius:var(--r-guest-control);min-height:40px;font-family:var(--font-body);font-size:13px;cursor:pointer;padding:0 14px}
/* Заголовок секции и подпись блока вместо надписей .aroma-caps */
.aroma-section-title{margin:4px 0 0;font-family:var(--font-display);font-size:19px;font-weight:400;line-height:1.15;color:var(--text-0)}
.aroma-section-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.aroma-section-row .aroma-section-title{margin:0}
.aroma-text-link{border:0;background:transparent;padding:6px 0;color:var(--text-1);font-family:var(--font-body);font-size:13px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.aroma-text-link:hover,.aroma-text-link:focus-visible{color:var(--text-0)}
.aroma-label{margin:0;font-family:var(--font-body);font-size:13px;font-weight:600;line-height:1.3;color:var(--text-1)}

/* Тонкая шапка и нижняя панель (#168); шесть пунктов с «Рилсами» (#153): поля 4px, колонка около 61px */
.topbar-icon-btn{margin-left:auto;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;border-radius:var(--r-guest-control);background:transparent;color:var(--text-muted);cursor:pointer}
.topbar-icon-btn:hover,.topbar-icon-btn:focus-visible{color:var(--text-0);background:var(--guest-control-bg-soft)}
.topbar-icon-btn+.topbar-icon-btn{margin-left:0}
.topbar-master-card{position:relative}
.topbar-master-card-dot{position:absolute;top:9px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bottom-nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0 4px var(--safe-bottom,0px);border-top:1px solid var(--line);background:var(--guest-topbar-bg);backdrop-filter:blur(18px);position:relative;z-index:20}
.bottom-nav-item{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.bottom-nav-item[aria-current="page"]{color:var(--text-0)}
.bottom-nav-item[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:0 0 2px 2px;background:var(--accent)}
.kit-mixer{flex:1 1 auto;display:grid;gap:16px;align-content:start;padding:12px 20px}
.kit-mixer-top{display:grid;grid-template-columns:36px 1fr 36px;align-items:center}
.kit-mixer-title{margin:0;text-align:center;font-family:var(--font-display);font-size:22px;color:var(--text-0)}
/* Кабинет (#151): в ките заглушка со списком избранного; сердечко — в шапке карточки микса */
.kit-cabinet{display:grid;gap:12px;align-content:start;grid-template-columns:minmax(0,1fr)}
.kit-cabinet-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-h1);line-height:1.05;color:var(--text-0)}
.heart-btn{flex:0 0 auto;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;margin:-4px -6px 0 0;border:0;border-radius:var(--r-guest-control);background:transparent;color:var(--text-muted);cursor:pointer}
.heart-btn[aria-pressed="true"]{color:var(--text-0)}
.heart-btn:hover,.heart-btn:focus-visible{color:var(--text-0);background:var(--guest-control-bg-soft)}
.heart-btn:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px}

/* Рилсы (#153): полоса превью над Подбором и лента со сценами. Исключение из VISUAL FOUNDATIONS — только здесь */
/* у прокручиваемого элемента в grid минимальная высота 0 — без min-height строка схлопывается */
.reel-strip{display:flex;align-items:flex-start;gap:10px;min-height:96px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.reel-strip::-webkit-scrollbar{display:none}
.reel-strip-item{flex:0 0 auto;width:68px;display:grid;gap:6px;justify-items:center;padding:0;border:0;background:transparent;color:var(--text-1);cursor:pointer}
.reel-strip-item:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px;border-radius:var(--r-guest-control)}
.reel-strip-thumb{position:relative;width:60px;height:60px;border-radius:var(--r-pill);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 0 3px var(--bg-base),0 0 0 4px var(--accent-border)}
.reel-strip-name{font-size:10.5px;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reels{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.reels::-webkit-scrollbar{display:none}
.reel-slot{height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.reel{position:relative;height:100%;overflow:hidden}
.reel-tap{position:absolute;inset:0;z-index:1;border:0;background:transparent;padding:0;cursor:pointer}
.reel-tap:focus-visible{outline:2px solid var(--accent-hover);outline-offset:-4px}
.reel-paused{position:absolute;left:50%;top:40%;z-index:2;width:56px;height:56px;margin:-28px 0 0 -28px;display:grid;place-items:center;border-radius:var(--r-pill);background:rgba(14,14,17,.55);border:1px solid var(--line);color:var(--text-0);pointer-events:none;backdrop-filter:blur(4px)}
.reel-hint{position:absolute;left:0;right:0;bottom:calc(100% + 6px);display:flex;flex-direction:column;align-items:center;color:var(--text-1);font-size:12px;pointer-events:none}
/* текст — HTML-слой поверх сцены: читается скринридером и не дёргается при паузе */
.reel-poster{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;pointer-events:none}
.reel-poster button{pointer-events:auto}
.reel-poster-center{flex:1 1 auto;min-height:0;display:grid;align-content:center;justify-items:center;gap:14px;padding:0 26px;text-align:center;background:radial-gradient(closest-side,rgba(14,14,17,.66) 0%,rgba(14,14,17,.34) 60%,transparent 100%)}
.reel-poster-center>*{min-width:0;max-width:100%}
.reel-dock{position:relative;display:grid;gap:10px;padding:40px 20px 20px;background:linear-gradient(180deg,transparent 0%,rgba(14,14,17,.62) 38%,rgba(14,14,17,.86) 100%)}
.reel-dock>*{min-width:0}
.reel-meta{display:flex;align-items:center;gap:8px}
.reel-meta .heart-btn{margin:0 -8px 0 auto}
.reel-name{margin:0;font-family:var(--font-display);font-size:34px;font-weight:400;line-height:1.35;color:var(--text-0);text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.55);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reel-desc{margin:0;max-width:28ch;font-family:var(--font-display);font-size:18px;font-style:italic;line-height:1.38;color:var(--text-0);text-wrap:pretty;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.reel-flavors{margin:0;font-size:14px;line-height:1.4;color:var(--text-1);text-shadow:0 1px 12px rgba(0,0,0,.6)}
.reel-reveal>*{animation:reel-in var(--dur-sheet) var(--ease-out) both}
.reel-reveal>*:nth-child(2){animation-delay:60ms}
.reel-reveal>*:nth-child(3){animation-delay:120ms}
.reel-reveal>*:nth-child(4){animation-delay:180ms}
.reel-reveal>*:nth-child(n+5){animation-delay:240ms}
@keyframes reel-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reel-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:2px}

/* Сцены стиля B — CSS-приближение мокапа; в приложении композиции Remotion. Штрих 1,2–1,4 в цвете профиля, без заливки */
.scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,color-mix(in srgb,var(--c1) 22%,#141417) 0%,#121215 62%,#0e0e11 100%)}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 38%,color-mix(in srgb,var(--c1) 20%,transparent) 0%,transparent 70%);animation:scene-breathe 6s ease-in-out infinite}
@keyframes scene-breathe{0%,100%{opacity:.7}50%{opacity:1}}
.scene-paused *,.scene-paused::after{animation-play-state:paused!important}
.p{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);color:color-mix(in srgb,var(--pc) 80%,#fff 20%);animation-duration:var(--d,6s);animation-delay:var(--dl);animation-iteration-count:infinite;animation-timing-function:linear;will-change:transform,opacity}
.p svg{display:block;width:100%;height:100%;overflow:visible}
.frost-rim{position:absolute;inset:0;box-shadow:inset 0 0 36px 4px color-mix(in srgb,var(--c1) 55%,transparent),inset 0 0 90px 8px color-mix(in srgb,var(--c2) 18%,transparent);animation:frost-rim 6s ease-in-out infinite}
@keyframes frost-rim{0%,100%{opacity:.55}50%{opacity:1}}
.m-frost,.m-berry{animation-name:m-fall}
.m-berry{animation-timing-function:ease-out}
@keyframes m-fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}12%{opacity:.95}50%{transform:translate(var(--dx),330px) rotate(90deg)}88%{opacity:.85}100%{transform:translate(0,700px) rotate(180deg);opacity:0}}
.bloom-core{position:absolute;left:50%;top:34%;width:0;height:0;animation:bloom-spin 12s linear infinite}
.bloom-petal{position:absolute;left:-38px;top:-110px;width:76px;height:110px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;border:1.4px solid color-mix(in srgb,var(--c1) 80%,#fff 20%);opacity:.85;animation:bloom-open 6s ease-in-out infinite}
@keyframes bloom-spin{to{transform:rotate(360deg)}}
@keyframes bloom-open{0%,100%{scale:.72}50%{scale:1}}
.m-bloom{animation-name:m-drift}
@keyframes m-drift{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-520px) rotate(220deg);opacity:0}}
.juicy-ring{position:absolute;left:50%;top:30%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:var(--r-pill);border:1.4px solid color-mix(in srgb,var(--c1) 75%,#fff 25%);animation:bloom-spin 24s linear infinite}
.m-juicy{animation-name:m-rise}
@keyframes m-rise{0%{transform:translate(0,40px);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-620px);opacity:0}}
.warm-glow{position:absolute;left:-10%;right:-10%;bottom:-10%;height:60%;background:radial-gradient(60% 70% at 50% 100%,color-mix(in srgb,var(--c1) 85%,#fff 5%) 0%,color-mix(in srgb,var(--c1) 35%,transparent) 45%,transparent 75%);animation:scene-breathe 3s ease-in-out infinite}
.m-warm{animation-name:m-ember;animation-timing-function:ease-out}
@keyframes m-ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{opacity:.5}60%{opacity:.95}100%{transform:translate(var(--dx),-560px);opacity:0}}
.m-smoke{animation-name:m-wisp;animation-timing-function:ease-in-out}
@keyframes m-wisp{0%{transform:translate(0,40px) scale(.6);opacity:0}25%{opacity:.75}100%{transform:translate(var(--dx),-460px) scale(1.8);opacity:0}}
.m-smoke svg path{stroke-dasharray:240;animation:m-draw var(--d,6s) linear infinite;animation-delay:var(--dl)}
@keyframes m-draw{from{stroke-dashoffset:240}to{stroke-dashoffset:-240}}
/* prefers-reduced-motion: сцена — статичный кадр, док появляется без анимации */
@media (prefers-reduced-motion: reduce){.scene *,.scene::after{animation-play-state:paused!important}.reel-reveal>*{animation:none}}

/* Access */
.aroma-access{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.aroma-access-body{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:clamp(24px,8vh,70px) 28px clamp(20px,3vh,28px);gap:clamp(18px,4vh,36px)}
.aroma-access-mark{display:block;width:clamp(44px,7vh,64px);height:auto;margin-bottom:clamp(10px,2vh,18px)}
.aroma-access-brand{display:block;font-family:var(--font-display);font-size:clamp(34px,7vh,46px);line-height:.96;color:var(--text-0)}
.aroma-access-tagline{margin:clamp(8px,1.4vh,12px) 0 0;font-size:14px;color:var(--text-1)}
/* AccessCodeInput рисует подпись поля классом .aroma-caps. До правки компонента sentence case задан здесь */
.aroma-access-form label.aroma-caps{font-size:13px;letter-spacing:0;text-transform:none;color:var(--text-1)}
.aroma-access-form{display:grid;gap:clamp(14px,2.6vh,24px);margin-top:auto}
.aroma-access-age{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.aroma-access-age-dot{width:20px;height:20px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--primary-foreground);font-size:12px;font-weight:700;cursor:pointer;padding:0}
.aroma-access-age-dot.on{border-color:var(--primary);background:var(--primary)}
.aroma-access-age-text{font-size:13px;color:var(--text-1);line-height:1.3}
.aroma-access-footer{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:12px}
.aroma-age-badge{border:1px solid var(--line);border-radius:var(--r-guest-badge);padding:1px 6px;font-weight:600;font-size:11px;color:var(--text-1);font-variant-numeric:tabular-nums}

/* Intro */
.aroma-intro{flex:1 1 auto;min-height:100%;position:relative;display:flex;flex-direction:column;padding:20px 24px 0;overflow:hidden}
.aroma-intro-body{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;justify-content:center}
.aroma-intro-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-title);line-height:1.02;color:var(--text-0);text-wrap:pretty}
.aroma-intro-text{margin:0;color:var(--text-1);font-size:15px;line-height:1.5;max-width:30ch}
.aroma-intro-dock,.aroma-onboarding-dock{flex:0 0 auto;display:grid;gap:10px;padding:12px 0 22px;border-top:1px solid var(--line-soft);background:var(--guest-dock-fade)}
.aroma-intro-pips{display:flex;justify-content:center;gap:6px}
.aroma-intro-pip{width:6px;height:6px;border-radius:999px;background:rgba(138, 100, 39,.3);transition:width var(--dur-slow)}
.aroma-intro-pip.on{width:22px;background:var(--primary)}
.aroma-onboarding-count{margin:0;text-align:center;font-size:13px;color:var(--text-1);font-variant-numeric:tabular-nums}

/* Onboarding */
.aroma-onboarding{flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 20px 0;gap:12px}
.aroma-onboarding-body{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.aroma-onboarding-title{margin:8px 0 0;font-family:var(--font-display);font-size:var(--fs-guest-h1);line-height:1.05;color:var(--text-0)}
.aroma-onboarding-hint{margin:0;color:var(--text-1);font-size:13px;line-height:1.5;max-width:32ch}
.aroma-profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.aroma-flavor-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}

/* Recommendations */
.aroma-recs{display:grid;gap:14px;align-content:start}
.aroma-recs-empty{display:grid;gap:14px;align-content:center;text-align:center;min-height:50dvh}
.aroma-empty-title{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.05;color:var(--text-0)}
.aroma-empty-text{margin:0 auto;font-size:14px;line-height:1.5;color:var(--text-1);max-width:30ch}
.aroma-empty-actions{display:grid;gap:10px;margin-top:8px}
/* Герой — ровная поверхность карточки, без подкраски гало профиля (#348) */
.aroma-recs-head{display:flex;justify-content:flex-end}
.aroma-recs-hero{border-radius:var(--r-guest-hero);padding:18px;display:grid;gap:14px;border:1px solid var(--line);background:var(--guest-card-bg);box-shadow:var(--shadow-guest-card)}
.aroma-recs-hero-head{display:flex;gap:14px;align-items:flex-start}
.aroma-recs-hero-text{min-width:0;display:grid;gap:6px}
.aroma-recs-hero-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-h2);line-height:1.1;color:var(--text-0)}
.aroma-recs-hero-desc{margin:0;font-size:12.5px;line-height:1.45;color:var(--text-1)}
.aroma-recs-hero-meta{display:flex;align-items:center;gap:10px}
.aroma-recs-hero-count{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
/* Приглашение в «Намиксуй»: строка без глифа и без надписи над ней */
.aroma-mixer-invite{display:grid;gap:8px;margin-top:10px}
.aroma-mixer-invite-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 16px;border-radius:var(--r-guest-control);border:1px solid var(--accent-border);background:transparent;color:var(--text-0);font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:border-color var(--dur-fast),background var(--dur-fast)}
.aroma-mixer-invite-btn:hover{border-color:var(--accent-hover);background:var(--accent-soft)}
.aroma-mixer-invite-note{margin:0;font-size:12px;line-height:1.4;color:var(--text-2);text-align:center}
.aroma-showcase-invite{padding:0 20px 4px}
.aroma-list{display:grid;gap:8px}

/* Showcase (#175): полка — заголовок с шевроном, под ним лента постеров, как у Okko */
.aroma-showcase{display:grid;gap:12px;align-content:start;padding:0 0 8px;margin:0 -20px}
.aroma-showcase-rail{display:grid;gap:2px}
.aroma-showcase-rail-head{margin:0;padding:0 6px 0 20px;font:inherit}
.aroma-showcase-rail-open{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0;border:0;background:transparent;color:var(--text-0);text-align:left;cursor:pointer}
