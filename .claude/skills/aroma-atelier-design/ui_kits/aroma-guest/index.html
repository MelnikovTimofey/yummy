<!-- @dsCard group="Арома Ателье · Guest" viewport="430x780" name="Гостевое приложение" subtitle="18+ gate → знакомство → онбординг → подбор / витрина / каталог → карточка" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Арома Ателье · Гость</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body,#root{margin:0;height:100%;width:100%}
body{font-family:var(--font-body);color:var(--text-primary);overflow-x:hidden;background:var(--guest-room-bg)}
.app-bg{min-height:100dvh;width:100%;display:grid;place-items:center;padding:16px;position:relative;overflow:hidden;background:var(--guest-halo-strong),var(--guest-halo-soft),linear-gradient(180deg,rgba(15,15,18,.94) 0%,rgba(20,20,23,1) 100%)}
.halo-top{position:absolute;top:-100px;right:-48px;width:260px;height:260px;border-radius:999px;background:radial-gradient(circle,rgba(176,74,62,.55) 0%,rgba(176,74,62,0) 70%);filter:blur(10px);opacity:.72}
.halo-bottom{position:absolute;bottom:-180px;left:-90px;width:320px;height:320px;border-radius:999px;background:radial-gradient(circle,rgba(176,74,62,.16) 0%,rgba(176,74,62,0) 72%);filter:blur(14px);opacity:.8}
.phone-shell{width:min(calc(100vw - 32px),430px);height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:var(--r-guest-shell);background:var(--guest-shell-bg);box-shadow:var(--shadow-guest-shell);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2}
.topbar{display:grid;gap:8px;padding:12px 20px 8px;border-bottom:1px solid var(--line);background:var(--guest-topbar-bg);position:sticky;top:0;z-index:20;box-shadow:0 12px 28px rgba(0,0,0,.18);backdrop-filter:blur(18px)}
.topbar-main-row{display:flex;align-items:center;gap:12px;width:100%}
.brand-home-btn{border:0;background:transparent;padding:0;min-height:40px;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:0 0 auto}
.brand{margin:0;font-family:var(--font-display);font-size:22px;line-height:1;letter-spacing:.01em;color:var(--text-0);white-space:nowrap}
.tagline{margin:4px 0 0;font-size:11px;letter-spacing:var(--caps-tracking-wide);text-transform:uppercase;color:var(--text-1)}
.topbar-right{margin-left:auto;display:inline-flex}
.header-auth-btn{border:1px solid var(--line);background:var(--secondary);color:var(--accent-hover);border-radius:var(--r-pill);min-height:40px;padding:0 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.guest-stage-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.content{padding:12px 20px;overflow-y:auto;overflow-x:hidden;display:grid;gap:12px;min-height:0;flex:1 1 auto;align-content:start;scrollbar-width:thin;scrollbar-color:#3A3A40 #1A1A1D}
.content-intro{padding:0;gap:0}
.guest-status{margin:0;color:var(--text-1);font-size:15px}
.guest-error{margin:0;color:var(--danger);font-size:12px;text-align:center}
.guest-ok{margin:0;color:var(--accent-hover);font-size:12px}
.aroma-skip{background:transparent;border:0;color:var(--text-2);font-size:11px;padding:4px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.aroma-ghost{border:1px solid var(--line);background:rgba(40,40,48,.5);color:var(--text-0);border-radius:14px;min-height:48px;padding:0 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;cursor:pointer}
.aroma-ghost-sm{border:1px solid var(--line);background:rgba(40,40,48,.54);color:var(--text-0);border-radius:12px;min-height:44px;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:0 14px}

/* Access */
.aroma-access{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.aroma-access-halo{position:absolute;inset:0;pointer-events:none;opacity:.92;background:radial-gradient(circle at 50% 12%,rgba(176,74,62,.30) 0%,transparent 38%),radial-gradient(circle at 12% 90%,rgba(176,74,62,.12) 0%,transparent 40%),radial-gradient(circle at 90% 86%,rgba(176,74,62,.16) 0%,transparent 38%)}
.aroma-access-body{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:clamp(24px,8vh,70px) 28px clamp(20px,3vh,28px);gap:clamp(18px,4vh,36px)}
.aroma-access-mark{display:block;width:clamp(44px,7vh,64px);height:auto;margin-bottom:clamp(10px,2vh,18px)}
.aroma-access-brand{display:block;font-family:var(--font-display);font-size:clamp(34px,7vh,46px);line-height:.96;color:var(--text-0)}
.aroma-access-tagline{margin:clamp(8px,1.4vh,12px) 0 0;font-size:11px;letter-spacing:var(--caps-tracking-wide);text-transform:uppercase;color:var(--text-1)}
.aroma-access-form{display:grid;gap:clamp(14px,2.6vh,24px);margin-top:auto}
.aroma-access-age{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.aroma-access-age-dot{width:20px;height:20px;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--primary-foreground);font-size:12px;font-weight:700;cursor:pointer;padding:0}
.aroma-access-age-dot.on{border-color:var(--primary);background:var(--primary)}
.aroma-access-age-text{font-size:13px;color:var(--text-1);line-height:1.3}
.aroma-access-footer{margin:0;color:var(--text-2);font-size:10.5px;text-align:center;letter-spacing:.16em;text-transform:uppercase}

/* Intro */
.aroma-intro{flex:1 1 auto;min-height:100%;position:relative;display:flex;flex-direction:column;padding:20px 24px 0;overflow:hidden}
.aroma-intro-watermark{position:absolute;top:14px;right:22px;font-family:var(--font-display);font-size:96px;line-height:1;color:rgba(176,74,62,.08);pointer-events:none}
.aroma-intro-body{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;justify-content:center;z-index:1}
.aroma-intro-content{display:flex;flex-direction:column;gap:18px}
.aroma-intro-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-title);line-height:1.02;color:var(--text-0);text-wrap:pretty}
.aroma-intro-text{margin:0;color:var(--text-1);font-size:15px;line-height:1.5;max-width:30ch}
.aroma-intro-dock,.aroma-onboarding-dock{flex:0 0 auto;display:grid;gap:10px;padding:12px 0 22px;border-top:1px solid var(--line-soft);background:var(--guest-dock-fade)}
.aroma-intro-pips,.aroma-onboarding-pips{display:flex;justify-content:center;gap:6px}
.aroma-intro-pip{width:6px;height:6px;border-radius:999px;background:rgba(176,74,62,.3);transition:width var(--dur-slow)}
.aroma-intro-pip.on{width:22px;background:var(--primary)}
.aroma-onboarding-pip{width:6px;height:6px;border-radius:999px;background:rgba(176,74,62,.3)}
.aroma-onboarding-pip.on{background:var(--primary)}

/* Onboarding */
.aroma-onboarding{flex:1 1 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 20px 0;gap:12px}
.aroma-onboarding-body{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.aroma-onboarding-title{margin:8px 0 0;font-family:var(--font-display);font-size:var(--fs-guest-h1);line-height:1.05;color:var(--text-0)}
.aroma-onboarding-hint{margin:0;color:var(--text-1);font-size:13px;line-height:1.5;max-width:32ch}
.aroma-profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.aroma-flavor-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.aroma-selected{margin-top:6px;display:grid;gap:6px}
.aroma-selected-row{display:flex;flex-wrap:wrap;gap:6px}
.aroma-selected-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-1)}
.aroma-selected-dot{width:8px;height:8px;border-radius:999px}

/* Selected-mix bar */
.aroma-selected-shell{padding:8px 20px 0;border-bottom:1px solid var(--line-soft);background:var(--guest-topbar-bg)}
.aroma-selected-text{margin:0;font-size:14px;line-height:1.55}

/* Recommendations */
.aroma-recs{display:grid;gap:14px;align-content:start}
.aroma-recs-empty{display:grid;gap:14px;align-content:center;text-align:center;min-height:50dvh}
.aroma-empty-title{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.05;color:var(--text-0)}
.aroma-empty-text{margin:0 auto;font-size:14px;line-height:1.5;color:var(--text-1);max-width:30ch}
.aroma-empty-actions{display:grid;gap:10px;margin-top:8px}
.aroma-recs-hero{border-radius:var(--r-guest-hero);padding:18px;display:grid;gap:14px;border:1px solid var(--line);box-shadow:var(--shadow-guest-card)}
.aroma-recs-hero-head{display:flex;gap:14px;align-items:flex-start}
.aroma-recs-hero-text{min-width:0;display:grid;gap:6px}
.aroma-recs-hero-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-h2);line-height:1.1;color:var(--text-0)}
.aroma-recs-hero-desc{margin:0;font-size:12.5px;line-height:1.45;color:var(--text-1)}
.aroma-recs-hero-meta{display:flex;align-items:center;gap:10px}
.aroma-list{display:grid;gap:8px}

/* Showcase */
.aroma-showcase{display:grid;gap:22px;padding:4px 0 8px;margin:0 -20px}
.aroma-showcase-rail{display:grid;gap:10px}
.aroma-showcase-head{display:flex;align-items:center;gap:10px;padding:0 20px}
.aroma-showcase-title{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.1;color:var(--text-0)}
.aroma-showcase-kind{padding:3px 8px;border-radius:999px;background:rgba(40,40,48,.5);border:1px solid var(--line-soft);color:var(--text-1);white-space:nowrap}
.aroma-scroller{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.aroma-scroller::-webkit-scrollbar{display:none}
.aroma-showcase-all{flex:0 0 auto;width:64px;border-radius:var(--r-xl);border:1px dashed var(--line);background:rgba(20,20,23,.5);color:var(--text-1);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}

/* Catalog */
.aroma-catalog{display:grid;gap:12px;align-content:start;position:relative}
.aroma-catalog-rail{display:grid;gap:8px;position:sticky;top:0;z-index:2;margin:-12px -20px 2px;padding:12px 20px 10px;border-bottom:1px solid var(--line-soft);background:rgba(20,20,23,.92);backdrop-filter:blur(12px)}
.aroma-catalog-search-row{display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:center}
.aroma-catalog-search{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--guest-control-bg);color:var(--text-0);padding:0 14px;font-size:13px;outline:none}
.aroma-catalog-search:focus-visible{border-color:var(--accent-hover)}
.aroma-catalog-icon-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--guest-control-bg);color:var(--text-1);position:relative;cursor:pointer}
.aroma-catalog-icon-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:999px;background:var(--primary)}
.aroma-chip-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.aroma-chip-scroll::-webkit-scrollbar{display:none}
.aroma-chip-scroll>button{flex:0 0 auto}
.aroma-catalog-popover{border:1px solid var(--line);border-radius:var(--r-xl);padding:14px;background:var(--guest-shell-bg);box-shadow:var(--shadow-guest-popover);display:grid;gap:10px}
.aroma-catalog-sort{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.aroma-sort-btn{min-height:36px;border-radius:12px;border:1px solid var(--line);background:var(--guest-control-bg-soft);color:var(--text-1);font-size:12px;cursor:pointer;padding:0 6px}
.aroma-sort-btn.on{border-color:var(--guest-chip-border-on);color:var(--guest-chip-ink-on);font-weight:600;background:var(--guest-chip-bg-on)}
.aroma-flavor-scroll{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;padding-right:4px}
.aroma-catalog-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Rail */
.aroma-rail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 20px 20px;overflow-y:auto}
.aroma-rail-topbar{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px}
.aroma-rail-back{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--guest-control-bg-soft);color:var(--text-0);font-size:18px;cursor:pointer}
.aroma-rail-topbar-text{min-width:0;display:grid;gap:2px}
.aroma-rail-meta{margin:0;font-size:11px;color:var(--text-2)}
.aroma-rail-code{border:1px solid rgba(176,74,62,.2);background:var(--secondary);color:var(--accent-hover);border-radius:999px;height:34px;padding:0 14px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.aroma-rail-intro{display:grid;gap:6px}
.aroma-rail-title{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.05;color:var(--text-0)}
.aroma-rail-desc{margin:0;color:var(--text-1);font-size:13px;line-height:1.5;max-width:36ch}

/* Mix sheet */
.aroma-sheet-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.aroma-sheet{width:min(calc(100vw - 16px),430px);max-height:92%;overflow-y:auto;display:grid;gap:14px;border:1px solid var(--line);border-radius:var(--r-guest-sheet) var(--r-guest-sheet) 0 0;box-shadow:var(--shadow-guest-sheet);padding:12px 20px 20px;animation:aroma-sheet-up var(--dur-sheet) var(--ease-out)}
@keyframes aroma-sheet-up{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.aroma-sheet-handle{width:40px;height:4px;border-radius:999px;background:rgba(176,74,62,.32);margin:0 auto 6px}
.aroma-sheet-head{display:flex;gap:14px;align-items:flex-start}
.aroma-sheet-head-text{min-width:0;display:grid;gap:6px;flex:1 1 auto}
.aroma-sheet-title{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.05;color:var(--text-0)}
.aroma-sheet-desc{margin:0;color:var(--text-1);font-size:13.5px;line-height:1.5}
.aroma-sheet-tags{display:flex;flex-wrap:wrap;gap:6px}
.aroma-sheet-block{display:grid;gap:10px}
.aroma-stars{display:flex;gap:8px}
.aroma-star{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(40,40,48,.9);color:var(--text-2);font-size:18px;cursor:pointer;padding:0}
.aroma-star.on{border-color:var(--guest-chip-border-on);background:var(--guest-chip-bg-on);color:var(--guest-chip-ink-on)}
.aroma-sheet-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:stretch}

/* Smoke confirmation */
.aroma-confirm{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column;gap:22px;padding:20px 28px 28px;overflow-y:auto;background:radial-gradient(circle at 50% 10%,rgba(176,74,62,.18) 0%,transparent 40%),radial-gradient(circle at 50% 100%,rgba(176,74,62,.2) 0%,transparent 35%)}
.aroma-confirm-topbar{display:flex;justify-content:flex-end}
.aroma-confirm-done{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--text-0);font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.aroma-confirm-stack{display:grid;gap:10px;justify-items:center;text-align:center}
.aroma-confirm-kicker{color:var(--primary)}
.aroma-confirm-title{margin:0;font-family:var(--font-display);font-size:var(--fs-guest-title);line-height:1.05;color:var(--text-0);max-width:14ch}
.aroma-confirm-composition{border-radius:var(--r-guest-card);padding:18px;border:1px solid var(--line);background:var(--guest-card-bg);display:grid;gap:10px}
.aroma-confirm-rate{margin-top:auto}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="mock-data.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="GuestScreens.jsx"></script>
<script type="text/babel" src="GuestApp.jsx"></script>
</body></html>
